<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1022">
<title>쿼텟 아레나 QUARTET ARENA</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0e1022;--pn:#181b36;--pn2:#22264a;--ln:#343a6b;--tx:#eef0ff;--dim:#9aa2d0;--gold:#ffd23f;--a:#5aa8ff;--b:#ff6a7a}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);-webkit-tap-highlight-color:transparent;
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
#app{max-width:560px;margin:0 auto;padding:0 12px max(16px,env(safe-area-inset-bottom))}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h3{font-size:14px;margin:18px 0 8px;color:var(--dim);font-weight:700}h3 small{font-weight:500;margin-left:6px}h4{font-size:12px;color:var(--dim);margin:14px 0 6px}
.dim{color:var(--dim);font-size:13px}.gold{color:var(--gold);font-weight:800}
.face{display:inline-block;flex:none;width:52px;height:52px;border-radius:14px;background:#2a2f5a center/contain no-repeat;vertical-align:middle}
.face.empty{display:inline-flex;align-items:center;justify-content:center;color:var(--ln);font-size:24px;background:transparent;border:2px dashed var(--ln)}
.face.lg{width:68px;height:68px}.face.sm{width:34px;height:34px;border-radius:9px}.face.xs{width:22px;height:22px;border-radius:6px;margin-right:6px}
.home{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.home h1{font-size:54px;line-height:.95;margin:0;font-weight:900;letter-spacing:1px;background:linear-gradient(180deg,#fff,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{margin:0 0 6px;color:var(--dim);letter-spacing:2px;font-size:13px}.lineup{display:flex;gap:8px;margin:8px 0 14px}
.btn{width:100%;border-radius:14px;background:var(--pn2);padding:14px 10px;font-size:17px;font-weight:800;border:2px solid var(--ln)}
.btn small{display:block;font-size:12px;font-weight:500;color:var(--dim);margin-top:3px}
.btn.pri{background:var(--gold);color:#1a1500;border-color:var(--gold)}.btn.pri small{color:#5a4a00}.btn:disabled{opacity:.4}
.link{color:var(--dim);font-size:12px;text-decoration:underline;margin-top:10px}
.page{padding-bottom:20px}.top{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:6px;background:var(--bg);padding:max(10px,env(safe-area-inset-top)) 0 10px;font-size:17px}
.ic{width:40px;height:40px;border-radius:12px;background:var(--pn2);font-size:18px}
.note{background:#2a2410;border:1px solid #6a5a10;color:#ffe9a0;border-radius:12px;padding:12px;font-size:14px;line-height:1.5}
.stages{display:grid;gap:8px}
.stage{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px;text-align:left;background:var(--pn);border:2px solid var(--ln);border-radius:14px;padding:10px 12px}
.stage .no{width:34px;height:34px;border-radius:50%;background:var(--pn2);display:flex;align-items:center;justify-content:center;font-weight:900}
.stage .nm{font-weight:800;font-size:15px}.stage small{display:block;font-weight:500;font-size:11px;color:var(--dim);margin-top:2px}
.stage em{font-style:normal;font-size:10px;background:var(--b);color:#fff;border-radius:6px;padding:1px 5px;margin-left:4px}.stage.boss{border-color:#7a3a4a}
.stage.lock{opacity:.4}.stars{color:var(--gold);letter-spacing:1px}.stars i,.bigstars i{color:#3a3f6a;font-style:normal}
.talk{background:var(--pn);border-radius:14px;padding:10px 12px;display:grid;gap:6px}.talk p{margin:0;font-size:14px;line-height:1.45}.talk b{color:var(--gold);margin-right:8px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--pn);border:2px solid var(--ln);border-radius:14px;padding:8px 2px;min-height:96px}
.slot small{font-size:11px;color:var(--dim);line-height:1.25;text-align:center}.slot.foe{border-color:#6a2f3f}.slot.sel{border-color:var(--gold);box-shadow:0 0 0 2px #ffd23f55}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.hc{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;background:var(--pn);border:2px solid var(--ln);border-radius:14px;padding:6px;cursor:pointer}
.hc.on{border-color:var(--a);background:#16264a}.hc .face{width:42px;height:42px}.hn{min-width:0}.hn b{display:block;font-size:14px}.hn small{font-size:10px;color:var(--dim);white-space:nowrap}
.up{background:var(--pn2);border-radius:10px;padding:5px 7px;font-weight:800;font-size:12px;min-width:54px}.up small{display:block;color:var(--gold);font-size:10px}.up.no{opacity:.45}
.info{display:flex;gap:10px;align-items:flex-start;background:var(--pn);border-radius:14px;padding:10px;margin-top:12px;font-size:13px;line-height:1.45}
.info i{font-style:normal;color:var(--dim);font-size:12px}.info .st{color:var(--dim);font-size:12px}.info .sk b{color:var(--gold)}
.sticky{position:sticky;bottom:max(10px,env(safe-area-inset-bottom));margin-top:14px;box-shadow:0 6px 20px #000a}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btns .btn{font-size:15px;padding:12px 6px}
.dteam{background:var(--pn);border-radius:14px;padding:10px;margin-top:10px;border-left:4px solid var(--a)}.dteam.t1{border-left-color:var(--b)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.lvs{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.lvs button{width:30px;height:30px;border-radius:9px;background:var(--pn2);font-size:16px}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.pk{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--pn);border-radius:12px;padding:6px 2px}
.pk .face{width:44px;height:44px}.pk small{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;max-width:100%;text-overflow:ellipsis}
.simres{background:var(--pn);border-radius:14px;padding:10px;margin-top:12px}.wr{display:flex;height:30px;border-radius:9px;overflow:hidden;font-weight:900;font-size:13px;margin-bottom:6px}
.wr span{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}.wr .a{background:var(--a);color:#001a3a}.wr .b{background:var(--b);color:#3a0010}
.result,.simres{overflow-x:auto}.stats{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;font-variant-numeric:tabular-nums}.stats th{color:var(--dim);font-weight:600;text-align:right;padding:3px 4px}
.stats td{text-align:right;padding:3px 4px;border-top:1px solid #ffffff12;white-space:nowrap}.stats td:first-child,.stats th:first-child{text-align:left}
.stats tr.t0 td:first-child{color:#9fd0ff}.stats tr.t1 td:first-child{color:#ffa3ad}.stats tr.dead{opacity:.5}
.barv{display:inline-block;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle;background:#ffb347}.barv.taken{background:#ff6a7a}.barv.heal{background:#7dffb0}
.battle{padding-top:max(8px,env(safe-area-inset-top))}.bar{display:flex;align-items:center;gap:6px;margin-bottom:8px}.bar .tt{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tm{font-weight:900;font-size:18px;min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.tg{height:40px;min-width:44px;padding:0 10px;border-radius:12px;background:var(--pn2);font-weight:900;font-size:13px;border:2px solid var(--ln)}.tg.on{background:var(--gold);color:#1a1500;border-color:var(--gold)}
#cv{display:block;width:100%;border-radius:14px;background:#000}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.chip{display:flex;align-items:center;gap:5px;background:var(--pn);border-radius:10px;padding:4px;border-bottom:3px solid var(--b);min-width:0}.chip.t0{border-bottom-color:var(--a)}
.cb{flex:1;min-width:0}.cb span{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cb em{font-style:normal;font-size:10px;color:#ffb347;font-variant-numeric:tabular-nums}
.hp{height:5px;border-radius:3px;background:#000a;overflow:hidden;margin:2px 0}.hp i{display:block;height:100%;width:100%;background:#5ad18a}.t1 .hp i{background:var(--b)}
.dead{opacity:.35;filter:grayscale(1)}
.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.skb{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--pn);border:2px solid var(--ln);border-radius:16px;padding:8px 4px;overflow:hidden}
.skb .face{width:56px;height:56px}.skb b{font-size:11px;line-height:1.2;min-height:26px;display:flex;align-items:center;text-align:center}.skb .hp{width:86%}
.skb kbd{position:absolute;left:6px;top:4px;font-size:10px;color:var(--dim);font-family:inherit}
.cdm{position:absolute;left:50%;top:8px;width:56px;height:56px;margin-left:-28px;border-radius:14px;background:conic-gradient(#000b calc(var(--p,1)*360deg),transparent 0);pointer-events:none}
.skb.rdy{border-color:var(--gold);box-shadow:0 0 14px #ffd23f88;animation:pulse .7s infinite alternate}.skb.want{border-color:#fff}
@keyframes pulse{to{transform:translateY(-3px)}}
.hint{text-align:center;margin:8px 0 0;min-height:18px}
.result{background:var(--pn);border:2px solid var(--ln);border-radius:16px;padding:14px;margin-top:12px;text-align:center;animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.result h2{margin:0;font-size:34px;font-weight:900}.result h2.w{color:var(--gold)}.result h2.l{color:var(--b)}.bigstars{font-size:30px;color:var(--gold);letter-spacing:4px}
.unlock{display:flex;align-items:center;gap:12px;text-align:left;background:#16264a;border:2px solid var(--a);border-radius:14px;padding:10px;margin:10px 0;font-size:16px}.unlock small{display:block;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
