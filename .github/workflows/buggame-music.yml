name: Buggame original soundtrack checks
on:
  push:
    paths:
      - 'buggame/**'
  pull_request:
    paths:
      - 'buggame/**'
jobs:
  score-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check buggame/music/original-scorebook-v2.js
      - run: node --test buggame/music/test-scorebook.cjs
