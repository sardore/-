<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120d19">
<meta name="description" content="사랑하는 엄마를 위한 작은 생일 축하. 촛불을 끄고 마음을 전해 보세요.">
<title>2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg2:#0d0912;
  --cream:#fbf0e2; --muted:#c8b3bd; --gold:#e8c79a; --gold-hi:#fff0cf; --rose:#f2b3bd;
  --ease:cubic-bezier(.22,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --display:"Noto Serif KR","Gowun Batang","Iowan Old Style","AppleMyungjo","Batang",Georgia,serif;
  --latin:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --body:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --light:1;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;min-width:320px;overflow-x:hidden;background:var(--bg2);color:var(--cream);font-family:var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}

/* ── page ── */
.page{position:relative;isolation:isolate;min-height:100vh;min-height:100svh;overflow-x:clip;
  padding:calc(22px + env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) calc(44px + env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left));
  background:
    radial-gradient(70% 38% at 50% 30%,rgba(112,58,84,.30),transparent 80%),
    radial-gradient(50% 30% at 0% 8%,rgba(150,88,96,.14),transparent 80%),
    radial-gradient(60% 30% at 100% 70%,rgba(112,78,128,.16),transparent 85%),
    linear-gradient(165deg,#24182a 0%,#170f20 50%,#0e0a14 100%)}
.page::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.32;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.67' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.15' filter='url(%23n)'/%3E%3C/svg%3E")}
.orb{position:fixed;z-index:0;border-radius:50%;filter:blur(64px);pointer-events:none;will-change:transform}
.o1{width:280px;height:280px;left:-100px;top:8%;background:#c76f86;opacity:.38;animation:drift1 22s ease-in-out infinite alternate}
.o2{width:340px;height:340px;right:-150px;top:46%;background:#7b5aa6;opacity:.26;animation:drift2 28s ease-in-out infinite alternate}
.o3{width:240px;height:240px;left:18%;bottom:-110px;background:#e8a76e;opacity:.2;animation:drift1 26s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(50px,60px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-60px,-50px) scale(1.1)}}
.dust{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.frame{position:absolute;inset:12px;z-index:0;pointer-events:none;border:1px solid rgba(224,193,153,.14);border-radius:6px}
.frame::before,.frame::after{content:"";position:absolute;width:24px;height:24px;border:1px solid rgba(224,193,153,.32)}
.frame::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.frame::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.wrap{position:relative;z-index:1;width:min(100%,520px);margin:0 auto}

.reveal{animation:rise 1s var(--ease) both;animation-delay:calc(var(--d,0)*1s)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ── header / hero ── */
.topbar{min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px;color:var(--gold);letter-spacing:.24em;font-size:10px;font-weight:500}
.brand svg{width:15px;height:15px}
.topnote{font:italic 500 14px var(--latin);color:rgba(232,199,154,.7);letter-spacing:.02em}
.hero{padding-top:18px;text-align:center}
.overline{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--gold);font:500 11px var(--latin);letter-spacing:.34em}
.overline::before,.overline::after{content:"";width:38px;height:1px;background:linear-gradient(90deg,transparent,rgba(232,199,154,.5))}
.overline::after{transform:scaleX(-1)}
h1{margin:22px 0 0;font:400 clamp(34px,9.2vw,52px)/1.4 var(--display);letter-spacing:-.06em;color:#fff6ea;word-break:keep-all;text-shadow:0 2px 30px rgba(240,160,150,.18)}
h1 .gold{background:linear-gradient(100deg,#e3b98a 0%,#fff2d2 38%,#dca877 56%,#f8e2b8 80%,#e3b98a 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600;animation:goldShift 7s linear infinite}
@keyframes goldShift{to{background-position:-220% 0}}
.subtitle{margin:16px auto 0;font-size:13px;line-height:1.95;color:var(--muted);letter-spacing:-.015em;word-break:keep-all;font-weight:300}

/* ── stage ── */
.stage{position:relative;width:min(100%,440px);margin:2px auto 0;aspect-ratio:420/430;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.halo{position:absolute;left:50%;top:44%;width:128%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,176,120,.30),rgba(232,120,130,.12) 48%,transparent 74%);
  opacity:calc(.2 + var(--light)*.8);transition:opacity 1s ease;animation:breathe 6s ease-in-out infinite}
.page.celebrated .halo{background:radial-gradient(closest-side,rgba(255,196,150,.34),rgba(242,130,160,.18) 48%,transparent 74%)}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.06)}}
.rays{position:absolute;left:50%;top:38%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,214,160,.075) 0 5deg,transparent 5deg 17deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,transparent 62%);mask-image:radial-gradient(circle,#000 0,transparent 62%);
  opacity:calc(var(--light)*.9);transition:opacity 1s ease;animation:spin 140s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.arch{position:absolute;top:1%;left:11%;width:78%;height:84%;border-radius:50% 50% 44% 44%;border:1px solid rgba(232,185,137,.12);pointer-events:none}
.arch::before{content:"";position:absolute;inset:14px;border-radius:inherit;border:1px solid rgba(232,185,137,.06)}
.spark{position:absolute;width:16px;height:16px;color:var(--gold);opacity:.7;pointer-events:none;animation:twinkle 3.4s ease-in-out infinite}
.sp1{top:14%;left:7%}.sp2{top:9%;right:11%;width:10px;height:10px;animation-delay:1.1s}
.sp3{top:44%;right:2%;width:13px;height:13px;animation-delay:.6s}.sp4{top:55%;left:1%;width:9px;height:9px;animation-delay:1.7s}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7) rotate(0)}50%{opacity:.95;transform:scale(1.15) rotate(20deg)}}

.cake-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;
  filter:drop-shadow(0 26px 26px rgba(5,2,10,.5)) brightness(calc(.8 + var(--light)*.2));transition:filter .9s ease}
.cake-float{animation:cakeFloat 6s ease-in-out infinite}
@keyframes cakeFloat{0%,100%{transform:translateY(1.5px)}50%{transform:translateY(-3px)}}
#cakeGlow{mix-blend-mode:screen;opacity:var(--light);transition:opacity .9s ease;pointer-events:none}
#frontDeco,#cakeGlow,#glows{pointer-events:none}
.glow{mix-blend-mode:screen;transform-box:fill-box;transform-origin:50% 50%;animation:glowPulse 2.6s ease-in-out infinite;transition:opacity .5s ease}
.glow.off{opacity:0;animation:none}
@keyframes glowPulse{0%,100%{opacity:.85;transform:scale(.96)}50%{opacity:1;transform:scale(1.07)}}

/* candles — no focus box, no tap highlight */
.candle{cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.candle:focus,.candle:active{outline:none}
.candle *{outline:none;-webkit-tap-highlight-color:transparent}
.candle .hit{fill:transparent;pointer-events:all}
.candle .ring{opacity:0;transition:opacity .2s}
.candle:focus-visible .ring{opacity:.9}
.lean,.flame-wrap,.flame{transform-box:fill-box;transform-origin:50% 100%}
.lean{transform:rotate(calc(var(--lean,0)*24deg));transition:transform .12s linear}
.flame-wrap{transition:opacity .5s ease,transform .6s var(--spring)}
.flame{animation:flicker 2.3s ease-in-out infinite}
.candle:nth-child(2) .flame{animation-delay:-.7s}.candle:nth-child(3) .flame{animation-delay:-1.3s}
.candle:nth-child(4) .flame{animation-delay:-.4s}.candle:nth-child(5) .flame{animation-delay:-1.9s}
@keyframes flicker{
  0%,100%{transform:rotate(-3deg) scale(.97,1.03)}
  30%{transform:rotate(3.5deg) scale(1.05,.97) skewX(2deg)}
  60%{transform:rotate(-1.5deg) scale(.94,1.07)}
  80%{transform:rotate(2deg) scale(1.02,1)}}
.candle:not(.out):hover .flame-wrap{transform:scale(1.12,1.18)}
.cake-svg.wishing .candle:not(.out) .flame-wrap{transform:scale(1.22,1.36)}
.cake-svg.blowing .lean{animation:leanBlow .9s ease-in forwards}
@keyframes leanBlow{0%{transform:rotate(0)}30%{transform:rotate(34deg) scale(1,.82)}55%{transform:rotate(22deg) scale(.95,.62)}100%{transform:rotate(30deg) scale(.9,.4)}}
.candle.out .flame-wrap{opacity:0;transform:scale(.25,.04);transition:opacity .4s ease,transform .4s ease-in}
.ember{opacity:0}
.candle.out .ember{animation:ember 2.6s ease-out forwards}
@keyframes ember{0%{opacity:1}60%{opacity:.6}100%{opacity:0}}
.smoke{fill:none;stroke:rgba(238,224,230,.75);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
.candle.out .smoke{animation:smoke 2.4s ease-out forwards}
.candle.out .smoke.s2{animation-delay:.25s}
@keyframes smoke{0%{stroke-dashoffset:1;opacity:0;transform:translate(0,0)}12%{opacity:.8}70%{opacity:.35}100%{stroke-dashoffset:0;opacity:0;transform:translate(5px,-12px)}}

.stage-caption{margin:2px 0 0;text-align:center;font:italic 500 15px var(--latin);color:rgba(232,199,154,.8);letter-spacing:.22em}

/* ── interaction ── */
.interaction{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:14px;text-align:center}
.progress{display:flex;gap:10px;align-items:center;justify-content:center}
.progress svg{width:11px;height:15px;fill:#f7c98d;filter:drop-shadow(0 0 6px rgba(246,186,106,.8));transition:fill .5s,filter .5s,transform .5s var(--spring),opacity .5s}
.progress svg.done{fill:rgba(234,197,183,.25);filter:none;transform:scale(.75);opacity:.8}
.status{margin:0;min-height:22px;font-size:12.5px;letter-spacing:-.02em;color:#cdb8c4}
.status.swap{animation:rise .5s var(--ease)}
.buttons{display:flex;flex-direction:column;align-items:stretch;gap:12px;width:min(100%,340px)}
.primary{position:relative;overflow:hidden;width:100%;min-height:60px;border:0;border-radius:999px;padding:0 22px;
  background:linear-gradient(135deg,#f4dcb5 0%,#fff0d2 45%,#e3b88c 100%);color:#4a2a37;font-weight:700;font-size:15px;letter-spacing:-.02em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -3px 8px rgba(160,100,70,.22),0 16px 36px -8px rgba(236,170,120,.38),0 0 0 1px rgba(255,226,186,.55);
  transition:transform .25s var(--ease),box-shadow .25s,opacity .3s}
.primary:hover{transform:translateY(-2px)}
.primary:active{transform:scale(.975)}
.primary.is-busy{pointer-events:none;opacity:.75}
.primary::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 33%,rgba(255,255,255,.5) 48%,transparent 63%);transform:translateX(-140%);animation:shimmer 5.5s ease-in-out infinite;pointer-events:none}
@keyframes shimmer{0%,70%{transform:translateX(-140%)}100%{transform:translateX(140%)}}
.primary .inner{position:relative;display:flex;align-items:center;justify-content:center;gap:10px}
.primary svg{width:18px;height:18px}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:ripple .7s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;font-size:12px;color:#e2cdd0;
  background:rgba(255,235,220,.06);border:1px solid rgba(236,200,170,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .25s,border-color .25s,color .25s}
.pill:hover{background:rgba(255,235,220,.11)}
.pill svg{width:15px;height:15px}
.pill[aria-pressed="true"],.pill.listening{background:rgba(244,201,150,.15);border-color:rgba(244,201,150,.55);color:#ffe8c4}
.meter{display:none;align-items:flex-end;gap:2px;height:12px}
.pill.listening .meter{display:inline-flex}
.pill.listening .mic-ico{display:none}
.meter i{width:2.5px;height:3px;border-radius:2px;background:#ffd9a0;transition:height .08s}

/* ── letter ── */
.letter-container{display:grid;grid-template-rows:0fr;opacity:0;transform:translateY(14px);transition:grid-template-rows .9s var(--ease),opacity .7s,transform .7s}
.letter-container.open{grid-template-rows:1fr;opacity:1;transform:none}
.letter-overflow{min-height:0;overflow:hidden}
.letter{position:relative;margin-top:36px;scroll-margin-top:24px;text-align:center;padding:30px 26px 34px;border-radius:18px;
  border:1px solid rgba(236,200,160,.28);
  background:linear-gradient(160deg,rgba(255,236,222,.11),rgba(255,200,200,.04) 55%,rgba(139,87,104,.07));
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,236,210,.14),0 28px 60px -10px rgba(0,0,0,.45)}
.letter::before{content:"";position:absolute;inset:8px;border-radius:12px;border:1px solid rgba(236,200,160,.13);pointer-events:none}
.seal{width:58px;height:58px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));transform:scale(.3) rotate(-40deg);opacity:0;transition:transform .9s var(--spring) .45s,opacity .5s .45s}
.letter-container.open .seal{transform:none;opacity:1}
.kicker{margin:16px 0 0;font:500 11px var(--latin);letter-spacing:.3em;color:#e5c79b}
.letter h2{margin:18px 0 16px;font:400 27px/1.5 var(--display);letter-spacing:-.05em;color:#fff3e4}
.letter p{margin:0 0 14px;color:#ecdad3;font-size:14px;line-height:2.1;word-break:keep-all;font-weight:300}
.letter p.signature{margin:20px 0 0;color:var(--gold);font-size:13px;font-weight:400}
.letter-end{margin:18px 0 0;font:italic 500 16px var(--latin);color:var(--gold);letter-spacing:.06em}
.ln{display:block;opacity:0;transform:translateY(10px);filter:blur(4px);transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease)}
.letter-container.open .ln{opacity:1;transform:none;filter:none;transition-delay:calc(.8s + var(--i)*.3s)}
.replay{display:inline-flex;align-items:center;gap:8px;margin-top:24px;padding:10px 18px;border-radius:999px;font-size:12px;color:#efd3bc;background:transparent;border:1px solid rgba(232,190,155,.3);transition:background .2s}
.replay:hover{background:rgba(243,203,177,.1)}
.divider{height:1px;margin:30px auto 0;background:linear-gradient(90deg,transparent,rgba(222,189,155,.3),transparent)}
.closing{text-align:center;margin:16px 0 0;font:italic 500 14px var(--latin);letter-spacing:.2em;color:rgba(204,176,177,.6)}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.bloom{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 38%,rgba(255,226,180,.55),rgba(244,160,176,.18) 38%,transparent 66%)}
.bloom.go{animation:bloom 1.8s ease-out}
@keyframes bloom{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
.toast{position:fixed;left:50%;bottom:26px;z-index:60;transform:translate(-50%,20px);padding:12px 18px;min-width:240px;max-width:calc(100vw - 40px);text-align:center;border-radius:12px;
  border:1px solid rgba(242,218,184,.24);background:rgba(35,23,36,.94);box-shadow:0 10px 30px rgba(0,0,0,.33);color:#f6e8dd;font-size:12px;line-height:1.6;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.visible{opacity:1;transform:translate(-50%,0)}

@media(max-width:390px){.page{padding-left:20px;padding-right:20px}h1{font-size:34px}.letter{padding-inline:20px}}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .orb,.halo,.rays,.cake-float,.flame,.glow,.spark,.primary::before,h1 .gold,.reveal{animation:none!important}
  .letter-container,.ln,.seal{transition:none}
}
</style>
</head>
<body>
<main class="page" id="page">
  <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i>
  <canvas id="dust" class="dust" aria-hidden="true"></canvas>
  <div class="frame" aria-hidden="true"></div>
  <div class="bloom" id="bloom" aria-hidden="true"></div>

  <div class="wrap">

    <section class="hero" aria-labelledby="main-title">
      <div class="overline reveal" style="--d:.15">A SPECIAL DAY</div>
      <h1 id="main-title" class="reveal" style="--d:.25">엄마, <span class="gold">생일</span><br>축하해요.</h1>
      <p class="subtitle reveal" style="--d:.38">오늘만큼은 세상의 모든 따뜻함이<br>엄마에게 닿기를 바라요.</p>
    </section>

    <section class="stage reveal" style="--d:.5" aria-label="생일 케이크와 터치해서 끌 수 있는 다섯 개의 촛불">
      <div class="rays" aria-hidden="true"></div>
      <div class="halo" aria-hidden="true"></div>
      <div class="arch" aria-hidden="true"></div>
      <svg class="spark sp1" viewBox="-10 -10 20 20" fill="currentColor" aria-hidden="true"><path d="M0 -9Q0 0 9 0Q0 0 0 9Q0 0 -9 0Q0 0 0 -9Z"/></svg>
      <svg class="spark sp2" viewBox="-10 -10 20 20" fill="currentColor" aria-hidden="true"><path d="M0 -9Q0 0 9 0Q0 0 0 9Q0 0 -9 0Q0 0 0 -9Z"/></svg>
      <svg class="spark sp3" viewBox="-10 -10 20 20" fill="currentColor" aria-hidden="true"><path d="M0 -9Q0 0 9 0Q0 0 0 9Q0 0 -9 0Q0 0 0 -9Z"/></svg>
      <svg class="spark sp4" viewBox="-10 -10 20 20" fill="currentColor" aria-hidden="true"><path d="M0 -9Q0 0 9 0Q0 0 0 9Q0 0 -9 0Q0 0 0 -9Z"/></svg>

      <svg class="cake-svg" id="cake-svg" viewBox="0 0 420 430" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="촛불 다섯 개가 켜진 분홍색 생일 케이크">
        <defs>
          <linearGradient id="gBottom" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a95f78"/><stop offset=".16" stop-color="#d98b98"/><stop offset=".38" stop-color="#f5c3c2"/><stop offset=".55" stop-color="#fdd9d2"/><stop offset=".8" stop-color="#e0a1a8"/><stop offset="1" stop-color="#9c5671"/></linearGradient>
          <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9a198"/><stop offset=".18" stop-color="#ecd4c6"/><stop offset=".42" stop-color="#fff7ec"/><stop offset=".62" stop-color="#fbe9dc"/><stop offset=".85" stop-color="#e2c1b6"/><stop offset="1" stop-color="#b98c88"/></linearGradient>
          <radialGradient id="gTopSurface" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#fffaf2"/><stop offset="1" stop-color="#f6dfcf"/></radialGradient>
          <radialGradient id="gBotSurface" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#fde9e0"/><stop offset="1" stop-color="#eab7b3"/></radialGradient>
          <linearGradient id="gGlaze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1a2b4"/><stop offset="1" stop-color="#cf6a85"/></linearGradient>
          <radialGradient id="gPlateTop" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#fff8ee"/><stop offset=".6" stop-color="#f3dcc8"/><stop offset="1" stop-color="#d8b394"/></radialGradient>
          <linearGradient id="gPlateRim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6c08d"/><stop offset="1" stop-color="#8a5b52"/></linearGradient>
          <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0c2"/><stop offset=".5" stop-color="#e2b877"/><stop offset="1" stop-color="#a9763f"/></linearGradient>

<script>
(() => {
'use strict';
const $ = (s, r=document) => r.querySelector(s);
const page = $('#page'), svg = $('#cake-svg');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const N = 5;

/* ───────── cake decoration (generated) ───────── */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = rng(11);
const ey = (cx,cy,rx,ry,x) => { const t=(x-cx)/rx; return cy+ry*Math.sqrt(Math.max(0,1-t*t)); };
const f1 = n => n.toFixed(1);
function pearls(cx,cy,rx,ry,x0,x1,step,r,dy){
  let s=''; for(let x=x0;x<=x1;x+=step) s+=`<circle cx="${x}" cy="${f1(ey(cx,cy,rx,ry,x)+dy)}" r="${r}" fill="url(#gPearl)"/>`; return s;
}
function flake(x,y,s){return `<polygon points="${f1(x)},${f1(y-s)} ${f1(x+s*1.1)},${f1(y+s*.3)} ${f1(x-s*.4)},${f1(y+s)}" fill="url(#gGold)" opacity=".9"/>`}

$('#botPearlsBase').innerHTML = pearls(210,352,130,26,92,328,13,3.4,-4);
$('#botPearlsTop').innerHTML  = pearls(210,284,130,26,86,334,12,2.7,0);
$('#topPearlsBase').innerHTML = pearls(210,282,90,19,128,292,11.5,2.3,-3);

let bf='';
for(let k=0;k<16;k++){
  const x=96+R()*228, yt=ey(210,284,130,26,x)+8, yb=ey(210,352,130,26,x)-9, y=yt+R()*(yb-yt);
  const rib=324+26*Math.sqrt(Math.max(0,1-Math.pow((x-210)/130,2)));
  if(Math.abs(y-rib)<10) continue;
  bf+=flake(x,y,1.6+R()*2.6);
}
$('#botFlakes').innerHTML=bf;
let tf='';
for(let k=0;k<7;k++){ const x=134+R()*152, yt=ey(210,205,90,19,x)+18, yb=ey(210,282,90,19,x)-8; tf+=flake(x,yt+R()*(yb-yt),1.5+R()*2); }
$('#topFlakes').innerHTML=tf;

let sp='';
for(let k=0;k<28;k++){
  const a=R()*6.283, rr=Math.sqrt(R())*.8, x=210+Math.cos(a)*rr*90, y=205+Math.sin(a)*rr*19, t=R();
  sp += t<.45 ? flake(x,y,1.3+R()*1.6) : t<.8 ? `<circle cx="${f1(x)}" cy="${f1(y)}" r="1.1" fill="#f1a8b6"/>` : `<circle cx="${f1(x)}" cy="${f1(y)}" r=".9" fill="#e2b877"/>`;
}
$('#topSprinkles').innerHTML=sp;

let dr='';
for(let x=128,i=0;x<=292;x+=15.5,i++){
  const xx=x+(R()-.5)*5, w=8.5+R()*4, L=(i%3===0?26:12)+R()*14, y0=ey(210,205,90,19,xx)+8, yb=y0+L;
  dr+=`<path d="M${f1(xx-w/2)} ${f1(y0-4)}V${f1(yb-w/2)}A${w/2} ${w/2} 0 0 0 ${f1(xx+w/2)} ${f1(yb-w/2)}V${f1(y0-4)}Z" fill="url(#gGlaze)"/>`;
  dr+=`<path d="M${f1(xx-w/4)} ${f1(y0+3)}V${f1(yb-w/2-1)}" stroke="#fff" stroke-opacity=".3" stroke-width="1.4" stroke-linecap="round" fill="none"/>`;
}
$('#drips').innerHTML=dr;

let fd='';
for(let k=0;k<9;k++){
  const x=126+k*21, y=ey(210,205,90,19,x)-1;
  fd += k%2===0 ? `<use href="#rosette" transform="translate(${x} ${f1(y)})"/>`
                : `<use href="#berry" transform="translate(${x} ${f1(y-3)}) scale(.82)"/>`;
}
$('#frontDeco').innerHTML=fd;

/* candles */
const H=[52,60,68,60,52], X=[150,180,210,240,270], Y=[207,210,211,210,207];
$('#glows').innerHTML = X.map((x,i)=>`<g transform="translate(${x} ${Y[i]-H[i]-17})"><circle class="glow" r="48" fill="url(#gGlow)"/></g>`).join('');
$('#candles').innerHTML = X.map((x,i)=>{
  const h=H[i], g=i%2?'gCandleB':'gCandleA', body=`M-6.5 ${-h}V0A6.5 2.4 0 0 0 6.5 0V${-h}Z`;
  return `<g class="candle" data-i="${i}" role="button" tabindex="0" aria-label="${i+1}번째 촛불 끄기" transform="translate(${x} ${Y[i]})">
    <ellipse cx="1.5" cy="1" rx="8" ry="3" fill="#6a2f44" opacity=".28"/>
    <path d="${body}" fill="url(#${g})"/>
    <path d="${body}" fill="url(#stripe)" opacity=".9"/>
    <ellipse cx="0" cy="${-h}" rx="6.5" ry="2.3" fill="#fff4e4"/>
    <ellipse cx="0" cy="${-h}" rx="3.2" ry="1.1" fill="#f6d2a0" opacity=".8"/>
    <path d="M0 ${-h}V${-h-6}" stroke="#3a2630" stroke-width="1.7" stroke-linecap="round"/>
    <circle class="ember" cx="0" cy="${-h-6}" r="1.7" fill="#ff8a4d"/>
    <g transform="translate(0 ${-h-7})">
      <path class="smoke s1" pathLength="1" d="M0 0C-7 -9 6 -15 0 -25S-6 -38 1 -48"/>
      <path class="smoke s2" pathLength="1" d="M0 0C6 -8 -5 -16 1 -24S7 -34 0 -42"/>
    </g>
    <g transform="translate(0 ${-h-4})"><g class="lean"><g class="flame-wrap"><g class="flame"><use href="#flameShape"/></g></g></g></g>
    <rect class="ring" x="-17" y="${-h-50}" width="34" height="${h+56}" rx="12" fill="none" stroke="#f3d6a2" stroke-dasharray="3 4"/>
    <rect class="hit" x="-16" y="${-h-48}" width="32" height="${h+52}"/>
  </g>`;
}).join('');
const candles=[...svg.querySelectorAll('.candle')], glows=[...svg.querySelectorAll('.glow')];

/* progress flames */
const FLAME='<svg viewBox="0 0 10 14"><path d="M5 0C8 4 9 6.5 9 9a4 4 0 0 1-8 0C1 6.5 2 4 5 0Z"/></svg>';
$('#progress').innerHTML=FLAME.repeat(N);
const dots=[...document.querySelectorAll('#progress svg')];

/* ───────── elements / state ───────── */
const status=$('#status'), blowBtn=$('#blow-btn'), blowLabel=$('#blow-label');
const micBtn=$('#mic-btn'), micLabel=$('#mic-label'), soundBtn=$('#sound-btn'), soundLabel=$('#sound-label');
const lc=$('#letter-container'), letter=$('#letter'), toast=$('#toast'), bloom=$('#bloom');
const meterBars=[...document.querySelectorAll('.meter i')];
let extinguished=new Set(), celebrated=false, busy=false, seq=0, lightLevel=1;
let soundEnabled=false, audioContext=null, master=null;
let micStream=null, micAnalyser=null, micSource=null, micInterval=null, micStarting=false, toastTimer=null, petalTimer=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const vibrate=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

function showToast(m){toast.textContent=m;toast.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('visible'),4800)}
function setStatus(t){if(status.textContent===t)return;status.classList.remove('swap');void status.offsetWidth;status.textContent=t;status.classList.add('swap')}
function setLight(v){lightLevel=v;page.style.setProperty('--light',v)}

/* ───────── audio ───────── */
function getAudio(){
  if(!audioContext){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;audioContext=new C()}
  if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
  return audioContext;
}
function out(){const a=getAudio();if(!a)return null;if(!master){master=a.createGain();master.connect(a.destination)}return master}
function stopMusic(){if(!master||!audioContext)return;const m=master;master=null;m.gain.setTargetAtTime(0,audioContext.currentTime,.06);setTimeout(()=>{try{m.disconnect()}catch(e){}},600)}
function bell(freq,t0=0,gain=.05){
  if(!soundEnabled)return;const a=getAudio(),o=out();if(!a||!o)return;
  [[1,1,1.5],[2,.32,.9],[3.01,.1,.5]].forEach(([m,g,d])=>{
    const osc=a.createOscillator(),v=a.createGain(),t=a.currentTime+t0;
    osc.type='sine';osc.frequency.value=freq*m;
    v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(gain*g,t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+d);
    osc.connect(v).connect(o);osc.start(t);osc.stop(t+d+.05);
  });
}
function puff(){
  if(!soundEnabled)return;const a=getAudio(),o=out();if(!a||!o)return;
  const len=Math.floor(a.sampleRate*.22),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource();s.buffer=buf;
  const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;f.Q.value=.7;
  const g=a.createGain();g.gain.value=.1;
  s.connect(f).connect(g).connect(o);s.start();
  bell(1046.5,.02,.012);
}
const MELODY=[[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],[392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],[392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,1],[698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]];
function playMelody(){if(!soundEnabled)return;let t=.35;for(const[f,b]of MELODY){bell(f,t,.05);t+=b*.46}}
soundBtn.addEventListener('click',()=>{
  soundEnabled=!soundEnabled;soundLabel.textContent=soundEnabled?'소리 끄기':'소리 켜기';soundBtn.setAttribute('aria-pressed',String(soundEnabled));
  if(soundEnabled){getAudio();bell(1046.5,0,.03);bell(1568,.1,.02)}else stopMusic();
});

/* ───────── fx canvas (confetti / sparks) ───────── */
const cv=$('#confetti'), ctx=cv.getContext('2d');
let cw=0,ch=0,particles=[],raf=0;
function fit(){const d=Math.min(devicePixelRatio||1,2);cw=innerWidth;ch=innerHeight;cv.width=Math.ceil(cw*d);cv.height=Math.ceil(ch*d);ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fit,{passive:true});fit();
const COLORS=['#f6dcaa','#fff4dc','#f2a9b6','#e07a93','#c99ab5','#e8c18f','#ffffff'];
const GOLDS=['#ffe6b0','#ffd58a','#fff3d6'];
const ROSE=['#f6b8c4','#f2a0b2','#ffd9de','#e8c18f'];
const SHAPES=['rect','rect','circle','heart','petal','spark'];
const rr=a=>Array.isArray(a)?a[0]+Math.random()*(a[1]-a[0]):a;
function emit(x,y,n,o={}){
  const {angle=-Math.PI/2,spread=Math.PI*2,power=9,shapes=SHAPES,colors=COLORS,size=[5,12],g=[.14,.22],max=[110,200],drag=[.985,.995],vr=.28}=o;
  for(let i=0;i<n;i++){
    const a=angle+(Math.random()-.5)*spread,s=power*(.35+Math.random()*.75);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,rot:Math.random()*6.283,vr:(Math.random()-.5)*vr,size:rr(size),color:colors[Math.random()*colors.length|0],shape:shapes[Math.random()*shapes.length|0],life:0,max:rr(max),tp:Math.random()*6.283,ts:.08+Math.random()*.12,drag:rr(drag),g:rr(g)});
  }
  if(!raf)raf=requestAnimationFrame(tick);
}
function draw(p){
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
  const flip=Math.cos(p.tp);ctx.globalAlpha=Math.max(0,Math.min(1,(p.max-p.life)/30));ctx.fillStyle=p.color;
  switch(p.shape){
    case 'rect':ctx.scale(1,flip);ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2.2);break;
    case 'circle':ctx.beginPath();ctx.arc(0,0,p.size*.3,0,6.283);ctx.fill();break;
    case 'heart':{const s=p.size/14;ctx.scale(s,s*flip);ctx.beginPath();ctx.moveTo(0,5);ctx.bezierCurveTo(-9,-1,-6,-9,0,-4);ctx.bezierCurveTo(6,-9,9,-1,0,5);ctx.fill();break}
    case 'petal':ctx.scale(1,flip);ctx.beginPath();ctx.ellipse(0,0,p.size*.55,p.size*.28,0,0,6.283);ctx.fill();break;
    case 'spark':{const r=p.size*.6;ctx.beginPath();ctx.moveTo(0,-r);ctx.quadraticCurveTo(0,0,r,0);ctx.quadraticCurveTo(0,0,0,r);ctx.quadraticCurveTo(0,0,-r,0);ctx.quadraticCurveTo(0,0,0,-r);ctx.fill();break}
  }
  ctx.restore();
}
function tick(){
  ctx.clearRect(0,0,cw,ch);
  particles=particles.filter(p=>p.life<p.max&&p.y<ch+40&&p.x>-40&&p.x<cw+40);
  for(const p of particles){p.life++;p.vx*=p.drag;p.vy=p.vy*p.drag+p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.tp+=p.ts;draw(p)}
  if(particles.length)raf=requestAnimationFrame(tick);else{raf=0;ctx.clearRect(0,0,cw,ch)}
}
function sparksAt(i){
  if(reduced)return;const r=candles[i].querySelector('.hit').getBoundingClientRect();
  emit(r.left+r.width/2,r.top+r.height*.18,9,{spread:1.6,power:2.6,shapes:['spark','circle'],colors:GOLDS,size:[3,6],g:[-.01,.02],max:[40,70],drag:.96});
}

/* ───────── ambient dust ───────── */
const dc=$('#dust'),dx=dc.getContext('2d');let dw=0,dh=0,motes=[],bokeh=[],shown=1,dlast=0;
function fitDust(){const d=Math.min(devicePixelRatio||1,2);dw=innerWidth;dh=innerHeight;dc.width=Math.ceil(dw*d);dc.height=Math.ceil(dh*d);dx.setTransform(d,0,0,d,0,0);
  motes=Array.from({length:Math.round(Math.min(60,dw*dh/14000))},()=>({x:Math.random()*dw,y:Math.random()*dh,r:.5+Math.random()*1.7,vy:.05+Math.random()*.2,ph:Math.random()*6.28,sp:.4+Math.random()*1.2,c:Math.random()<.65?'255,222,170':'255,190,205'}));
  bokeh=Array.from({length:6},()=>({x:Math.random()*dw,y:Math.random()*dh,r:26+Math.random()*44,vx:(Math.random()-.5)*.08,vy:-.03-Math.random()*.06,a:.025+Math.random()*.03}))}
addEventListener('resize',fitDust,{passive:true});fitDust();
function dustTick(ts){
  const dt=Math.min(40,ts-dlast||16);dlast=ts;shown+=(lightLevel-shown)*.04;
  dx.clearRect(0,0,dw,dh);const k=.45+.55*shown;
  for(const b of bokeh){b.x+=b.vx*dt*.06*16;b.y+=b.vy*dt*.06*16;if(b.y<-b.r)b.y=dh+b.r;if(b.x<-b.r)b.x=dw+b.r;if(b.x>dw+b.r)b.x=-b.r;
    const g=dx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);g.addColorStop(0,`rgba(255,200,150,${b.a*k})`);g.addColorStop(1,'rgba(255,200,150,0)');dx.fillStyle=g;dx.beginPath();dx.arc(b.x,b.y,b.r,0,6.283);dx.fill()}
  for(const m of motes){m.y-=m.vy*dt*.06*16;m.ph+=dt*.001*m.sp;m.x+=Math.sin(m.ph)*.12;if(m.y<-4){m.y=dh+4;m.x=Math.random()*dw}
    const a=(.25+.55*Math.abs(Math.sin(m.ph*1.3)))*k;dx.fillStyle=`rgba(${m.c},${a.toFixed(3)})`;dx.beginPath();dx.arc(m.x,m.y,m.r,0,6.283);dx.fill()}
  requestAnimationFrame(dustTick);
}
if(!reduced)requestAnimationFrame(dustTick);

/* ───────── candle logic ───────── */
function updateUI(auto){
  const o=extinguished.size;
  dots.forEach((d,i)=>d.classList.toggle('done',i<o));
  if(o===N)setStatus('엄마의 모든 소원이 이루어지길 ✨');
  else if(!auto)setStatus(o===0?'촛불을 하나씩 터치하거나, 한 번에 꺼 보세요.':`촛불 ${o}개를 껐어요. 이제 ${N-o}개 남았어요.`);
}
function extinguish(i,{auto=false}={}){
  if(extinguished.has(i)||celebrated)return;
  extinguished.add(i);
  candles[i].classList.add('out');glows[i].classList.add('off');
  candles[i].setAttribute('aria-label',`${i+1}번째 촛불 꺼짐`);
  sparksAt(i);puff();vibrate(10);
  setLight((N-extinguished.size)/N);updateUI(auto);
  if(extinguished.size===N){stopMic();const t=seq;setTimeout(()=>{if(t===seq)celebrate()},reduced?150:900)}
}
candles.forEach((c,i)=>{
  c.addEventListener('click',()=>{if(busy)return;extinguish(i);c.blur()});
  c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!busy)extinguish(i)}});
});
async function blowAll(skipWish){
  if(busy||celebrated)return;busy=true;const t=++seq;stopMic();blowBtn.classList.add('is-busy');
  if(!skipWish&&!reduced){setStatus('눈을 감고 소원을 빌어 보세요…');svg.classList.add('wishing');await sleep(1700);if(t!==seq)return;svg.classList.remove('wishing')}
  svg.classList.add('blowing');setStatus('후~');
  for(const i of [...Array(N).keys()].filter(i=>!extinguished.has(i))){await sleep(reduced?0:130);if(t!==seq)return;extinguish(i,{auto:true})}
}
blowBtn.addEventListener('click',()=>{celebrated?reset():blowAll(false)});
blowBtn.addEventListener('pointerdown',e=>{
  const r=blowBtn.getBoundingClientRect(),s=document.createElement('span'),d=Math.max(r.width,r.height)*1.2;
  s.className='ripple';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  blowBtn.appendChild(s);s.addEventListener('animationend',()=>s.remove());
});
$('#replay-btn').addEventListener('click',reset);

function celebrate(){
  if(celebrated||extinguished.size!==N)return;
  celebrated=true;busy=false;blowBtn.classList.remove('is-busy');
  page.classList.add('celebrated');setLight(.7);
  bloom.classList.remove('go');void bloom.offsetWidth;bloom.classList.add('go');
  playMelody();vibrate([30,40,30,40,60]);
  if(!reduced){
    const r=$('.stage').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.4;
    emit(cx,cy,120,{power:10});
    setTimeout(()=>emit(0,ch*.7,60,{angle:-Math.PI/3,spread:.9,power:13}),250);
    setTimeout(()=>emit(cw,ch*.7,60,{angle:-Math.PI*2/3,spread:.9,power:13}),250);
    let n=0;clearInterval(petalTimer);
    petalTimer=setInterval(()=>{emit(Math.random()*cw,-12,2,{angle:Math.PI/2,spread:.8,power:1.2,shapes:['petal','heart'],colors:ROSE,size:[9,15],g:[.012,.03],max:[260,380],drag:.992,vr:.1});if(++n>28)clearInterval(petalTimer)},220);
  }
  blowLabel.textContent='다시 촛불 켜기';
  lc.classList.add('open');lc.setAttribute('aria-hidden','false');lc.inert=false;
  setTimeout(()=>letter.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'}),reduced?0:1100);
}
function reset(){
  seq++;busy=false;celebrated=false;extinguished.clear();stopMic();stopMusic();clearInterval(petalTimer);particles=[];
  svg.classList.remove('blowing','wishing');page.classList.remove('celebrated');
  lc.classList.remove('open');lc.setAttribute('aria-hidden','true');lc.inert=true;
  blowBtn.classList.remove('is-busy');blowLabel.textContent='소원을 빌고 촛불 끄기';
  dots.forEach(d=>d.classList.remove('done'));setStatus('촛불을 하나씩 터치하거나, 한 번에 꺼 보세요.');
  candles.forEach((c,i)=>setTimeout(()=>{c.classList.remove('out');glows[i].classList.remove('off');c.setAttribute('aria-label',`${i+1}번째 촛불 끄기`);setLight((i+1)/N)},300+i*150));
  scrollTo({top:0,behavior:reduced?'auto':'smooth'});
}

/* ───────── mic (blow) ───────── */
async function startMic(){
  if(micStarting)return;if(micStream){stopMic();return}
  if(celebrated){showToast('다시 촛불을 켠 뒤 입김으로 꺼 보세요.');return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showToast('이 브라우저에서는 마이크를 사용할 수 없어요. 화면의 버튼으로 촛불을 꺼 주세요.');return}
  if(window.isSecureContext===false){showToast('이 주소에서는 마이크가 막혀 있어요. 크롬/사파리에서 직접 열어 주세요.');return}
  micStarting=true;micLabel.textContent='마이크 연결 중…';
  /* 오디오 컨텍스트는 탭 제스처 안에서 바로 만들어야 iOS/모바일에서 안 막혀요 (await 뒤에 만들면 무음이 됨) */
  const ac=getAudio();
  try{
    if(!ac)throw Object.assign(new Error('no audio'),{name:'NoAudioContext'});
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    micStream=stream;if(celebrated){stopMic();return}
    if(ac.state!=='running')await ac.resume();
    micSource=ac.createMediaStreamSource(stream);micAnalyser=ac.createAnalyser();micAnalyser.fftSize=1024;micSource.connect(micAnalyser);
    micBtn.classList.add('listening');micLabel.textContent='듣는 중 · 취소';setStatus('휴대폰 마이크에 후~ 하고 불어 보세요.');
    const data=new Uint8Array(micAnalyser.fftSize);let base=.018,loud=0;
    micInterval=setInterval(()=>{
      if(!micAnalyser)return;micAnalyser.getByteTimeDomainData(data);
      let s=0;for(let i=0;i<data.length;i++){const v=(data[i]-128)/128;s+=v*v}
      const rms=Math.sqrt(s/data.length);if(rms<.055)base=base*.94+rms*.06;
      const level=Math.min(1,rms*6);svg.style.setProperty('--lean',(level*.9).toFixed(2));
      meterBars.forEach((b,i)=>b.style.height=(3+level*9*(.5+.5*Math.sin(Date.now()/90+i)))+'px');
      loud=rms>Math.max(.07,base*3.2)?loud+1:Math.max(0,loud-1);
      if(loud>=3)blowAll(true);
    },70);
  }catch(e){
    stopMic();
    const n=e&&e.name;
    showToast((
      n==='NotAllowedError'||n==='SecurityError' ? '마이크 권한이 막혀 있어요. 브라우저 설정에서 허용하거나, 앱 안 미리보기가 아닌 크롬/사파리에서 열어 주세요.' :
      n==='NotFoundError'||n==='OverconstrainedError' ? '마이크를 찾을 수 없어요. 촛불을 직접 터치해 주세요.' :
      n==='NotReadableError' ? '다른 앱이 마이크를 쓰고 있어요. 닫고 다시 눌러 주세요.' :
      '마이크 연결에 실패했어요. 촛불을 직접 터치하거나 아래 버튼을 눌러 주세요.')+' ['+(n||'error')+(e&&e.message?': '+String(e.message).slice(0,60):'')+']');
  }
  finally{micStarting=false;if(!micStream)micLabel.textContent='입김으로 끄기'}
}
function stopMic(){
  if(micInterval){clearInterval(micInterval);micInterval=null}
  if(micSource){try{micSource.disconnect()}catch(e){}micSource=null}
  micAnalyser=null;if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}
  micBtn.classList.remove('listening');micLabel.textContent='입김으로 끄기';svg.style.setProperty('--lean','0');
  meterBars.forEach(b=>b.style.height='');
  if(!busy&&!celebrated&&extinguished.size<N)updateUI();
}
micBtn.addEventListener('click',startMic);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMic()});
addEventListener('pagehide',stopMic);

updateUI();
})();
</script>
</body>
</html>
