const HALF={dart:[[11,0],[4,1.8],[-3,3],[-7.5,2],[-7.5,0]],hull:[[10.5,0],[7,3.2],[1,5.2],[-8,5.2],[-9,0]],scout:[[10,0],[3.5,2.3],[-5,2.6],[-7,1.6],[-7,0]]};
function drawShip(c,d,flame,tm,scMul){
  const L=d.L,sc=SHIP_SC[d.t]*(scMul||1),h=L.h;
  c.save();c.scale(sc,sc);c.lineJoin='round';
  const lite='hsl('+h+',35%,95%)',mid='hsl('+h+',45%,72%)',dark='hsl('+h+',50%,36%)',acc='hsl('+h+',95%,66%)';
  const fl=(x,y,len,w)=>{const gr=c.createLinearGradient(x,0,x-len,0);gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(.35,'hsla('+(h+10)+',100%,70%,.8)');gr.addColorStop(1,'hsla('+(h+10)+',100%,60%,0)');c.fillStyle=gr;c.beginPath();c.moveTo(x,y-w);c.lineTo(x-len,y);c.lineTo(x,y+w);c.closePath();c.fill()};
  const fk=.25+.75*(flame||0);
  if(L.arrow){
    fl(-4,0,4+6*fk*(1+.2*Math.sin(tm*40)),1.5);
    c.fillStyle='#fff';c.beginPath();c.moveTo(10,0);c.lineTo(-7,6);c.lineTo(-3,0);c.lineTo(-7,-6);c.closePath();c.fill();c.restore();return;
  }
  const wide=L.kind==='hull'?1.25:1,E=L.engines||1,ex=L.kind==='dart'?-7.5:-8.5;
  const ys=E===1?[0]:E===2?[-2.6,2.6]:E===3?[-4,0,4]:[-5.2,-1.8,1.8,5.2];
  ys.forEach((y,i)=>fl(ex,y*wide,(3+6.5*fk)*(1+.25*Math.sin(tm*38+i*2)),1.3));
  if(L.halo){const gr=c.createRadialGradient(0,0,4,0,0,19);gr.addColorStop(0,'hsla('+h+',100%,70%,.0)');gr.addColorStop(.7,'hsla('+h+',100%,70%,.22)');gr.addColorStop(1,'hsla('+h+',100%,70%,0)');c.fillStyle=gr;c.beginPath();c.arc(0,0,19,0,TAU);c.fill()}
  c.lineWidth=.9;
  // 태양광 패널
  if(L.panels){for(const sg of[-1,1]){c.strokeStyle=dark;c.lineWidth=.8;c.beginPath();c.moveTo(-1,sg*2.5);c.lineTo(-1,sg*7);c.stroke();
    c.fillStyle='hsl(218,65%,36%)';c.strokeStyle='hsl(205,90%,75%)';c.lineWidth=.7;c.beginPath();c.rect(-5.5,sg>0?7:-14.5,8.5,7.5);c.fill();c.stroke();
    c.beginPath();c.moveTo(-2.7,sg>0?7:-14.5);c.lineTo(-2.7,sg>0?14.5:-7);c.moveTo(.1,sg>0?7:-14.5);c.lineTo(.1,sg>0?14.5:-7);c.moveTo(-5.5,sg>0?10.7:-11);c.lineTo(3,sg>0?10.7:-11);c.stroke()}}
  // 날개
  for(let i=0;i<(L.fins||0);i++){const x0=2.5-i*4.4,w=(L.kind==='hull'?6.5:7.5)+i*2.3;
    for(const sg of[-1,1]){c.fillStyle=mid;c.strokeStyle=dark;c.beginPath();c.moveTo(x0,sg*2.6);c.lineTo(x0-10-i*1.6,sg*w);c.lineTo(x0-6.5,sg*2.6);c.closePath();c.fill();c.stroke();
      c.strokeStyle=acc;c.lineWidth=.6;c.beginPath();c.moveTo(x0-3,sg*3.2);c.lineTo(x0-9.5-i*1.6,sg*(w-.5));c.stroke();c.lineWidth=.9}}
  // 포드
  for(let i=0;i<(L.pods||0);i++){const y=6.2+i*3.6;
    for(const sg of[-1,1]){c.strokeStyle=dark;c.lineWidth=1;c.beginPath();c.moveTo(-1,sg*(y-3));c.lineTo(-1,sg*y);c.stroke();
      c.fillStyle=mid;c.beginPath();c.moveTo(3,sg*(y-1.3));c.lineTo(-6,sg*(y-1.3));c.lineTo(-7,sg*y);c.lineTo(-6,sg*(y+1.3));c.lineTo(3,sg*(y+1.3));c.lineTo(5,sg*y);c.closePath();c.fill();c.stroke();
      c.fillStyle=acc;c.beginPath();c.arc(3.4,sg*y,.8,0,TAU);c.fill();fl(-7,sg*y,3+4*fk,.8)}}
  // 선체
  const half=HALF[L.kind],pts=half.concat(half.slice(1,-1).reverse().map(q=>[q[0],-q[1]]));
  const wd=L.kind==='hull'?5.4:3.4,gr=c.createLinearGradient(0,-wd,0,wd);gr.addColorStop(0,lite);gr.addColorStop(.55,mid);gr.addColorStop(1,dark);
  c.fillStyle=gr;c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=.8;c.beginPath();pts.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.closePath();c.fill();c.stroke();
  for(let i=0;i<(L.plates||0);i++){c.strokeStyle='hsla('+h+',60%,25%,.8)';c.lineWidth=1;c.beginPath();c.moveTo(5.5-i*3.6,-wd*.7);c.lineTo(7.5-i*3.6,0);c.lineTo(5.5-i*3.6,wd*.7);c.stroke()}
  // 포·가시
  if(L.cannons){const n=L.cannons;for(let j=0;j<n;j++){const y=n===1?0:(j?2.8:-2.8);c.fillStyle=dark;c.fillRect(3,y-.7,9.5,1.4);c.fillStyle=acc;c.fillRect(11.5,y-.8,1.4,1.6)}}
  if(L.spike){c.fillStyle=lite;c.strokeStyle=acc;c.lineWidth=.8;c.beginPath();c.moveTo(10,-1.8);c.lineTo(20,0);c.lineTo(10,1.8);c.closePath();c.fill();c.stroke()}
  if(L.dish){c.strokeStyle=dark;c.lineWidth=.8;c.beginPath();c.moveTo(2,-2.4);c.lineTo(2,-6);c.stroke();c.strokeStyle=acc;c.lineWidth=1.2;c.beginPath();c.arc(3.5,-6.2,3.2,-PI/2,PI/2,false);c.stroke();c.fillStyle=acc;c.beginPath();c.arc(3.5,-6.2,.8,0,TAU);c.fill()}
  if(L.ring){c.strokeStyle='hsla('+h+',100%,72%,.7)';c.lineWidth=.9;c.beginPath();c.ellipse(0,0,13,8.5,0,0,TAU);c.stroke();const a=tm*2;c.fillStyle=acc;c.beginPath();c.arc(Math.cos(a)*13,Math.sin(a)*8.5,1.1,0,TAU);c.arc(Math.cos(a+PI)*13,Math.sin(a+PI)*8.5,1.1,0,TAU);c.fill()}
  c.fillStyle=acc;c.beginPath();c.ellipse(3,0,2.7,1.5,0,0,TAU);c.fill();c.fillStyle='rgba(255,255,255,.8)';c.beginPath();c.ellipse(3.7,-.4,1,.5,0,0,TAU);c.fill();
  for(let i=0;i<(L.drones||0);i++){const a=tm*(1.6+i*.4)+i*TAU/(L.drones),r=15+i*1.5;c.fillStyle=acc;c.beginPath();c.arc(Math.cos(a)*r,Math.sin(a)*r*.7,1.5,0,TAU);c.fill()}
  c.restore();
}

let st='title',planets,stars,holes,parts,texts,ship,camY,score,combo,maxCombo,hops,nextOffer,genY,genI,up,cards=[],pickT=0,deadT=0,deadWhy='',shake=0,T=0,newBest=false;

function mkPlanet(i,x,y){
  let t='n';const r=Math.random();
  if(i>4){if(r<.2)t='r';else if(r<.36)t='g'}
  const R=t==='g'?rnd(34,42):t==='r'?rnd(16,20):rnd(22,30);
  const ring=(t==='g'?92:t==='r'?64:76)-Math.min(i*.45,16);
  return{i,x,y,R,cap:R+ring,t,hue:t==='r'?8:t==='g'?36:rnd(190,320),seen:false,ph:rnd(0,TAU),dead:false,re:0,born:1,sq:0,pulse:0};
}
const capOf=p=>p.R+(p.cap-p.R)*(1+.18*up.grav);
const spd=()=>(235+Math.min(hops*3,165))*(1+.06*up.spd);
const dec=p=>(5+Math.min(hops*.22,9))*(p.t==='r'?2.2:p.t==='g'?.5:1)*Math.pow(.78,up.decay);
const o2max=()=>2.6+.8*up.o2;

function gen(){
  while(genY>camY-320){
    const prev=planets[planets.length-1];
    const dy=rnd(150,200)+Math.min(genI*1.2,40);
    let x,n=0;do{x=rnd(58,W-58)}while(Math.abs(x-prev.x)<75&&n++<20);
    genY-=dy;
    const p=mkPlanet(genI++,x,genY);planets.push(p);
    const k=Math.random()<.75?1+(Math.random()*3|0):0;
    for(let j=0;j<k;j++){const f=(j+1)/(k+1);stars.push({x:clamp(prev.x+(p.x-prev.x)*f+rnd(-22,22),14,W-14),y:prev.y+(p.y-prev.y)*f+rnd(-22,22),got:false,ph:rnd(0,TAU)})}
    if(genI>7&&Math.random()<Math.min(.14+genI*.006,.45)){
      const h={x:clamp(W-(prev.x+p.x)/2+rnd(-40,40),30,W-30),y:genY+dy/2+rnd(-30,30),r:13};

function update(dt){

    if(bf&&s.ramT<=0&&Math.hypot(s.x-boss.x,s.y-boss.y)<boss.hr+sr()+3){ram();if(st!=='play'||!boss||boss.state!=='fight')return}

  const f=clamp(b.hp/b.max,0,1);g.fillStyle=b.hitT>0?'#fff':'hsl('+b.d.hue+',90%,58%)';rr(bx,by,Math.max(8,bw*f),11,5);g.fill();
  g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=2;const ph=b.d.kind==='quasar'?[.66,.33]:[.5];for(const q of ph){g.beginPath();g.moveTo(bx+bw*q,by);g.lineTo(bx+bw*q,by+11);g.stroke()}
  txt(Math.max(0,Math.ceil(b.hp))+' / '+b.max,VW/2,by+25,11,'rgba(255,255,255,.65)','center',600);
  if(b.state==='fight'){
    let x=VW/2-(b.q.length*74)/2+37;for(const a of b.q){const [nm,c]=ATK[a.k];rr(x-34,by+34,68,22,8);g.fillStyle='rgba(10,8,24,.75)';g.fill();g.strokeStyle=a.t<=1?'#ff6a6a':c;g.lineWidth=1.5;g.stroke();txt(nm+' '+a.t,x,by+49,12,a.t<=1?'#ff9a9a':c,'center',700);x+=74}
    if(bcombo>0)txt('연속 박치기 x'+bcombo,VW/2,by+74,13,'#ff9d7a','center',700);
    // 산소 게이지 (보스전: 회복되지 않는다)
    const ow=280,ox=VW/2-ow/2,oy=VH-44,of=clamp(bo2/bo2max,0,1),low=bo2<6;
    g.fillStyle='rgba(255,255,255,.14)';rr(ox,oy,ow,12,6);g.fill();g.fillStyle=low?'rgba(255,'+Math.floor(80+80*Math.sin(T*10))+',80,1)':'#b8a8ff';rr(ox,oy,Math.max(6,ow*of),12,6);g.fill();
    g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=1.5;rr(ox,oy,ow,12,6);g.stroke();
    txt('산소 '+bo2.toFixed(1)+'초',VW/2,oy-8,12,low?'#ff9a9a':'rgba(220,210,255,.85)','center',700);
  }
}

/* ---------- 입력 ---------- */
function tap(px,py,key){
  ac();
  if(!key&&px/S>VW-58&&py/S>VH-58){toggleMute();return}
  if(st==='title'){st='play';beep(520,.1);return}
  if(st==='play'){release();return}
  if(st==='pick'){
    if(pickT<.45||key)return;
    const vx=px/S,vy=py/S;
    for(let i=0,n=pickMode==='evo'?evoOpts.length:cards.length;i<n;i++){const r=cardRect(i);if(vx>=r.x&&vx<=r.x+r.w&&vy>=r.y&&vy<=r.y+r.h){choose(i);return}}
    return;
  }
  if(st==='clear'&&clearT>1){offer();if(st==='clear')st='play';return}
  if(st==='dead'&&deadT>.7){reset();st='play'}
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap(e.clientX,e.clientY,false)});
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.key==='m'||e.key==='M'){toggleMute();return}
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();tap(0,0,true)}
  else if(st==='pick'&&pickT>.45&&(e.key==='1'||e.key==='2'||e.key==='3')){const i=+e.key-1;if((pickMode==='evo'?evoOpts:cards)[i])choose(i)}
});

/* ---------- 루프 ---------- */
function step(dt){ // 한 프레임의 논리 갱신. 화면 그리기에 쓸 dt(gdt)를 정한다
  T+=dt;MU.tgt=musicWant();
  if(flashA>0)flashA=Math.max(0,flashA-dt*2.4);
  zoom+=(0-zoom)*Math.min(1,dt*10);
  if(banner){banner.t+=dt;if(banner.t>banner.dur)banner=null}
  if(tsT>0){tsT-=dt;if(tsT<=0)ts=1}
  if(freeze>0){freeze-=dt;gdt=dt*.1;return}
  const sd=dt*ts;gdt=sd;
  if(st==='title'){const s=ship;s.a+=sd*spd()/s.r;s.x=s.p.x+Math.cos(s.a)*s.r;s.y=s.p.y+Math.sin(s.a)*s.r;s.trail.push(s.x,s.y);if(s.trail.length>48)s.trail.splice(0,2)}
  else if(st==='play'){update(sd/2);if(st==='play')update(sd/2)}
  else if(st==='pick')pickT+=dt;
  else if(st==='dead'){deadT+=dt;if(boss)updateBossIdle(sd)}
  else if(st==='clear')clearT+=dt;
}
function updateBossIdle(dt){boss.st+=dt}
let lastT=0;
function frame(now){
  const dt=Math.min(.033,(now-lastT)/1000||0);lastT=now;
  step(dt);draw(gdt||dt);
  requestAnimationFrame(frame);
}
reset();
/* 디버그/자동 테스트용 */
function botAct(){
  if(st==='title'){tap(0,0,true);return}
  if(st==='pick'){if(pickT>.5)choose(0);return}
  if(st==='clear'&&clearT>1){tap(0,0,true);return}
  if(st==='dead'&&deadT>.8){tap(0,0,true);return}
  if(st!=='play'||ship.mode!=='orb')return;
  if(boss&&boss.state!=='fight')return;
  const s=ship,p=s.p,hx=-Math.sin(s.a)*s.dir,hy=Math.cos(s.a)*s.dir;let tx,ty,tr;
  if(boss){tx=boss.x;ty=boss.y;tr=boss.R+2}
  else{let bp=null;for(const q of planets){if(q.seen||q.dead||q.y>s.y)continue;if(!bp||q.y>bp.y)bp=q}if(!bp)return;tx=bp.x;ty=bp.y;tr=capOf(bp)*.5}
  const dx=tx-s.x,dy=ty-s.y,tp=dx*hx+dy*hy,perp=Math.abs(dx*hy-dy*hx);
  if((tp>0&&perp<tr)||s.r<p.R+13)release();
}
window.__dbg={
  get:()=>({st,score,hops,combo,mode:ship.mode,up,boss:boss?{n:boss.d.n,hp:boss.hp,max:boss.max,state:boss.state,turn:boss.turn,q:boss.q.map(a=>a.k+a.t),phase:boss.phase}:null,bo2,bossIdx,kills,haz:haz.length}),
  jump(i){if(st==='title')st='play';bossIdx=i;hops=Math.max(hops,1);nextBoss=0;},
  sim(sec,opts){opts=opts||{};const n=Math.round(sec*60);for(let i=0;i<n;i++){if(!opts.nobot)botAct();step(1/60);if(opts.draw&&i%opts.draw===0)draw(gdt||1/60)}return this.get()},
  draw(){draw(1/60)},
  set(o){if(o.hp!=null&&boss)boss.hp=o.hp;if(o.o2!=null)bo2=o.o2;if(o.shield!=null)up.shield=o.shield;if(o.hops!=null)hops=o.hops},
  ev(){return {freeze,ts,shake,zoom,flashA}},
  tier(n,path){path=path||[0,0,0];while(tier<n){const o=SHIPS[SHIPS[shipId].kids[path[tier-1]||0]];if(!o)break;evolveTo(o)}},
  atk(k,t){const a=mkTele(k);a.t=t;boss.q.push(a);telePing(a)},
  ship(){return {tier,shipId,up:Object.assign({},up),nextOffer}}
};
requestAnimationFrame(frame);
</script>
