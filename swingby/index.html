<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>스윙바이 SWINGBY</title>
<style>
html,body{margin:0;height:100%;background:#05060f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* 스윙바이 SWINGBY — 원터치 궤도 로그라이트 + 항성 보스전. 단일 파일, 의존성 없음. */
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=420,TAU=Math.PI*2,PI=Math.PI;
const FONT='system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
let S=1,VW=420,VH=700,OX=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const cw=window.innerWidth,ch=window.innerHeight;
  cv.width=Math.round(cw*DPR);cv.height=Math.round(ch*DPR);
  S=Math.min(cw/W,ch/620);VW=cw/S;VH=ch/S;OX=(VW-W)/2;
}
window.addEventListener('resize',resize);resize();

const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pickOf=a=>a[Math.floor(Math.random()*a.length)];
let best=0,bestBoss=0;
try{best=+localStorage.getItem('swingby_best')||0;bestBoss=+localStorage.getItem('swingby_boss')||0}catch(e){}

/* ---------- 데이터 ---------- */
const UP=[
  {k:'grav',n:'중력 증폭',d:'포획 범위 +18%',max:4,c:'#7dd3ff'},
  {k:'decay',n:'안정 궤도',d:'궤도 붕괴 속도 -22%',max:4,c:'#9dffb0'},
  {k:'o2',n:'산소 탱크',d:'비행 시간 +0.8초 · 보스전 산소 +3초',max:3,c:'#b8a8ff'},
  {k:'mag',n:'별 자석',d:'별 수집 범위 +70%',max:3,c:'#ffe27a'},
  {k:'shield',n:'비상 추진기',d:'사망 1회 방지 (누적 가능)',max:9,c:'#ff9d7a'},
  {k:'mult',n:'항해 일지',d:'모든 점수 +25%',max:5,c:'#ff8fd0'},
  {k:'ram',n:'박치기 강화',d:'보스에게 주는 충돌 피해 +25%',max:4,c:'#ff6a6a'}
];
/* 항성 보스. kind 는 그리는 방식, pat 는 쓰는 패턴, q 는 동시에 예고해 두는 공격 수 */
const BOSSES=[
  {n:'프록시마 센타우리',e:'PROXIMA CENTAURI',R:36,hp:120,hue:10,kind:'dwarf',col:['#ffd9a8','#ff7a3a','#8a2208'],pat:['flare','meteor'],q:1,line:'가장 가까운 이웃 별'},
  {n:'시리우스',e:'SIRIUS',R:42,hp:170,hue:205,kind:'spike',col:['#ffffff','#9fd8ff','#2a62b8'],pat:['beam','comet','flare'],q:2,line:'밤하늘에서 가장 밝은 별'},
  {n:'베가',e:'VEGA',R:44,hp:220,hue:218,kind:'ring',col:['#ffffff','#b4c8ff','#4660c8'],pat:['comet','wind','collapse','beam'],q:2,line:'빠르게 자전하는 푸른 별'},
  {n:'알데바란',e:'ALDEBARAN',R:52,hp:280,hue:28,kind:'giant',col:['#ffe0a0','#ff9a3a','#a04a10'],pat:['meteor','hole','collapse','flare'],q:2,line:'황소의 눈, 늙은 거성'},
  {n:'안타레스',e:'ANTARES',R:56,hp:350,hue:2,kind:'pulse',col:['#ffc0a0','#e83a2a','#6a0a10'],pat:['beam','collapse','flare','hole','meteor'],q:3,line:'전갈의 심장, 맥동하는 적색 초거성'},
  {n:'베텔게우스',e:'BETELGEUSE',R:60,hp:430,hue:16,kind:'super',col:['#ffd0a0','#ff6a2a','#7a1608'],pat:['meteor','comet','hole','collapse','beam','wind','flare'],q:3,line:'곧 폭발할 초거성'},
  {n:'TON 618',e:'TON 618',R:50,hp:700,hue:275,kind:'quasar',col:['#000','#05030a','#000'],pat:['hole','beam','jet','collapse','meteor','comet','flare','wind'],q:3,line:'태양 660억 개의 질량, 우주의 끝'}
];
const ATK={meteor:['운석','#ffb06a'],comet:['혜성','#9fe8ff'],beam:['광선','#ff6a8a'],jet:['제트','#c89aff'],flare:['플레어','#ffe27a'],hole:['블랙홀','#c88aff'],collapse:['행성 붕괴','#ff7a6a'],wind:['항성풍','#8affc8']};

let st='title',planets,stars,holes,parts,texts,ship,camY,score,combo,maxCombo,hops,nextOffer,genY,genI,up,cards=[],pickT=0,deadT=0,deadWhy='',shake=0,T=0,newBest=false;
let boss=null,haz=[],fxr=[],bossIdx=0,nextBoss=10,bo2=0,bo2max=0,arenaCam=0,bcombo=0,starChain=0,kills=0,cleared=false,clearT=0;
let freeze=0,ts=1,tsT=0,zoom=0,flashA=0,flashC='#fff',banner=null,toastO=null,gdt=0,lowO2=0;
const bg=[];for(let i=0;i<110;i++)bg.push({x:Math.random(),y:Math.random()*2000,z:rnd(.08,.5),s:rnd(.5,1.7)});

function mkPlanet(i,x,y){
  let t='n';const r=Math.random();
  if(i>4){if(r<.2)t='r';else if(r<.36)t='g'}
  const R=t==='g'?rnd(34,42):t==='r'?rnd(16,20):rnd(22,30);
  const ring=(t==='g'?92:t==='r'?64:76)-Math.min(i*.45,16);
  return{i,x,y,R,cap:R+ring,t,hue:t==='r'?8:t==='g'?36:rnd(190,320),seen:false,ph:rnd(0,TAU),dead:false,re:0,born:1,sq:0,pulse:0};
}
const capOf=p=>p.R+(p.cap-p.R)*(1+.18*up.grav);
const spd=()=>235+Math.min(hops*3,165);
const dec=p=>(5+Math.min(hops*.22,9))*(p.t==='r'?2.2:p.t==='g'?.5:1)*Math.pow(.78,up.decay);
const o2max=()=>2.6+.8*up.o2;

function gen(){
  while(genY>camY-320){
    const prev=planets[planets.length-1];
    const dy=rnd(150,200)+Math.min(genI*1.2,40);
    let x,n=0;do{x=rnd(58,W-58)}while(Math.abs(x-prev.x)<75&&n++<20);
    genY-=dy;
    const p=mkPlanet(genI++,x,genY);planets.push(p);
    const k=Math.random()<.75?1+(Math.random()*3|0):0;
    for(let j=0;j<k;j++){const f=(j+1)/(k+1);stars.push({x:clamp(prev.x+(p.x-prev.x)*f+rnd(-22,22),14,W-14),y:prev.y+(p.y-prev.y)*f+rnd(-22,22),got:false,ph:rnd(0,TAU)})}
    if(genI>7&&Math.random()<Math.min(.14+genI*.006,.45)){
      const h={x:clamp(W-(prev.x+p.x)/2+rnd(-40,40),30,W-30),y:genY+dy/2+rnd(-30,30),r:13};
      const d1=Math.hypot(h.x-p.x,h.y-p.y),d2=Math.hypot(h.x-prev.x,h.y-prev.y);
      if(d1>p.cap+40&&d2>prev.cap+40)holes.push(h);
    }
  }
}

function reset(){
  planets=[];stars=[];holes=[];parts=[];texts=[];score=0;combo=0;maxCombo=0;hops=0;nextOffer=7;genI=0;newBest=false;
  up={grav:0,decay:0,o2:0,mag:0,shield:0,mult:0,ram:0};
  boss=null;haz=[];fxr=[];bossIdx=0;nextBoss=10;bcombo=0;starChain=0;kills=0;cleared=false;
  freeze=0;ts=1;tsT=0;zoom=0;flashA=0;banner=null;toastO=null;lowO2=0;
  const p=mkPlanet(0,W/2,0);p.seen=true;p.t='n';p.R=26;p.cap=110;p.hue=205;planets.push(p);genI=1;genY=0;camY=-VH*.64;
  ship={mode:'orb',p,a:PI/2,r:p.R+52,dir:1,x:p.x,y:p.y+p.R+52,vx:0,vy:0,air:0,swept:0,trail:[],last:null,inv:0,ramT:0,hitF:false};
  gen();shake=0;
}

/* ---------- 소리 ---------- */
let AC=null,NB=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}else if(AC.state==='suspended'){AC.resume()}}
function beep(f,d,type,vol){
  if(!AC)return;
  try{const o=AC.createOscillator(),ga=AC.createGain(),t=AC.currentTime;o.type=type||'triangle';o.frequency.setValueAtTime(f,t);
    ga.gain.setValueAtTime(vol||.11,t);ga.gain.exponentialRampToValueAtTime(.001,t+d+.08);o.connect(ga);ga.connect(AC.destination);o.start(t);o.stop(t+d+.1)}catch(e){}
}
function thump(f0,f1,d,vol,type){ // 피치가 뚝 떨어지는 묵직한 타격음
  if(!AC)return;
  try{const o=AC.createOscillator(),ga=AC.createGain(),t=AC.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);
    ga.gain.setValueAtTime(vol||.3,t);ga.gain.exponentialRampToValueAtTime(.001,t+d+.05);o.connect(ga);ga.connect(AC.destination);o.start(t);o.stop(t+d+.08)}catch(e){}
}
function noise(d,vol,f0,f1){ // 필터 걸린 노이즈: 폭발·바람·균열
  if(!AC)return;
  try{if(!NB){const n=AC.sampleRate;NB=AC.createBuffer(1,n,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1}
    const t=AC.currentTime,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),ga=AC.createGain();s.buffer=NB;s.loop=true;fl.type='lowpass';fl.frequency.setValueAtTime(f0,t);
    fl.frequency.exponentialRampToValueAtTime(Math.max(40,f1||f0*.15),t+d);ga.gain.setValueAtTime(vol,t);ga.gain.exponentialRampToValueAtTime(.001,t+d);
    s.connect(fl);fl.connect(ga);ga.connect(AC.destination);s.start(t);s.stop(t+d+.05)}catch(e){}
}
const vibe=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ---------- 이펙트 ---------- */
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(30,sp||150);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,l:rnd(.3,.8),c,s:3})}}
function sparks(x,y,c,n,sp,dir,spread){for(let i=0;i<n;i++){const a=dir+rnd(-spread,spread),v=rnd(sp*.4,sp);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,l:rnd(.2,.55),c,s:rnd(1.5,3.5),line:true})}}
function ringFx(x,y,c,r0,r1,dur,w){fxr.push({x,y,c,r0,r1,t:0,dur:dur||.45,w:w||3})}
function hitstop(t){freeze=Math.max(freeze,t)}
function punch(z){zoom=Math.max(zoom,z)}
function flashScreen(a,c){flashA=Math.max(flashA,a);flashC=c||'#fff'}
function slowmo(f,t){ts=f;tsT=t}
function toast(s,c){toastO={t:0,s,c:c||'#fff'}}
function add(n,x,y,c,label,big){n=Math.round(n*(1+.25*up.mult));score+=n;texts.push({x,y,t:0,s:(label?label+'  ':'')+'+'+n,c:c||'#fff',sz:big||15})}

/* ---------- 코어 ---------- */
function release(){
  const s=ship;if(s.mode!=='orb')return;
  if(boss&&boss.state!=='fight')return;
  const v=spd();s.mode='free';s.vx=-Math.sin(s.a)*s.dir*v;s.vy=Math.cos(s.a)*s.dir*v;s.last=s.p;s.air=0;s.hitF=false;starChain=0;
  beep(620,.04);noise(.22,.16,5000,400);
  sparks(s.x,s.y,'#bfeaff',9,260,Math.atan2(-s.vy,-s.vx),.5);ringFx(s.x,s.y,'rgba(190,235,255,.8)',4,26,.3,2);shake=Math.max(shake,2.2);
}
function latch(p,dx,dy,d){
  const s=ship;
  s.mode='orb';s.p=p;s.r=Math.max(d,p.R+12);s.a=Math.atan2(dy,dx);s.dir=(dx*s.vy-dy*s.vx)>=0?1:-1;
  const quick=s.swept<TAU*1.05;s.swept=0;s.air=0;s.last=null;
  p.pulse=1;p.sq=.55;
  ringFx(p.x,p.y,'hsla('+p.hue+',90%,75%,.9)',p.R,capOf(p)*.9,.5,3);
  thump(170,60,.16,.2);
  if(boss){
    if(boss.state==='fight'){bcombo=s.hitF?bcombo+1:0;s.hitF=false;beep(330,.07);bossTurn()}
    return;
  }
  if(!p.seen){
    p.seen=true;hops++;combo=quick?combo+1:1;maxCombo=Math.max(maxCombo,combo);
    const close=d<p.R+24;
    add((p.t==='r'?20:10)*combo+(close?10:0),p.x,p.y-p.R-16,combo>1?'#7dd3ff':'#fff',close?'근접 스윙!':combo>1?'x'+combo+' 콤보':null,close?19:15);
    beep(420+Math.min(combo,12)*55,.1);burst(s.x,s.y,'hsl('+p.hue+',90%,72%)',12+Math.min(combo,10));
    if(close){hitstop(.045);punch(.025);shake=Math.max(shake,3.5);sparks(s.x,s.y,'#fff',10,300,TAU*Math.random(),PI)}
    if(combo>=5&&combo%5===0){flashScreen(.18,'#7dd3ff');punch(.03);toast('x'+combo+' 콤보!','#7dd3ff')}
  }else beep(300,.06);
}
function die(why){
  const s=ship;
  if(up.shield>0){
    up.shield--;let bp=null;
    for(const p of planets){if(p.dead)continue;if(p.y<camY+VH-70&&p.y>camY+50&&(!bp||Math.hypot(p.x-s.x,p.y-s.y)<Math.hypot(bp.x-s.x,bp.y-s.y)))bp=p}
    bp=bp||s.p;
    let a=Math.atan2(s.y-bp.y,s.x-bp.x);if(!isFinite(a))a=0;
    s.mode='orb';s.p=bp;s.r=capOf(bp)-4;s.a=a;s.swept=0;s.air=0;s.last=null;s.trail.length=0;s.inv=1.5;
    s.x=bp.x+Math.cos(a)*s.r;s.y=bp.y+Math.sin(a)*s.r;
    if(!boss&&!bp.seen){bp.seen=true;hops++}
    if(boss)bo2=Math.max(bo2,6);
    combo=0;texts.push({x:s.x,y:s.y-20,t:0,s:'비상 추진!',c:'#ff9d7a',sz:17});burst(s.x,s.y,'#ff9d7a',22,220);ringFx(s.x,s.y,'#ff9d7a',6,90,.5,4);beep(220,.25,'sawtooth');noise(.4,.2,3000,200);shake=10;hitstop(.1);flashScreen(.3,'#ff9d7a');
    return;
  }
  st='dead';deadT=0;deadWhy=why;shake=18;hitstop(.14);flashScreen(.5,'#fff');slowmo(.35,.9);
  burst(s.x,s.y,'#fff',34,280);burst(s.x,s.y,'#ff6a6a',24,200);ringFx(s.x,s.y,'#fff',6,140,.6,4);ringFx(s.x,s.y,'#ff6a6a',6,100,.5,3);
  beep(110,.5,'sawtooth',.14);thump(120,30,.6,.4);noise(.7,.3,4000,100);vibe([60,40,120]);
  if(score>best){best=score;newBest=true;try{localStorage.setItem('swingby_best',String(best))}catch(e){}}
}
function offer(){
  const pool=UP.filter(u=>up[u.k]<u.max);cards=[];
  while(cards.length<3&&pool.length)cards.push(pool.splice(Math.random()*pool.length|0,1)[0]);
  if(cards.length){st='pick';pickT=0;beep(660,.12);setTimeout(()=>beep(880,.14),90)}
}
function choose(i){up[cards[i].k]++;st='play';beep(780,.1);texts.push({x:ship.x,y:ship.y-24,t:0,s:cards[i].n,c:cards[i].c,sz:16});ringFx(ship.x,ship.y,cards[i].c,6,70,.5,3)}

/* ---------- 보스 ---------- */
function bossLoop(){return Math.floor(bossIdx/BOSSES.length)}
function startBoss(){
  const s=ship,P=s.p,d=BOSSES[bossIdx%BOSSES.length],loop=bossLoop();
  arenaCam=P.y-VH+110;
  const by=arenaCam+190+d.R*.55;
  planets=planets.filter(p=>p===P);stars=[];holes=[];
  const yMin=by+d.R+60,yMax=P.y-95;let list=[P];
  const clear=(p,L)=>{const dx=by>=0?0:0,ax=p.x,ay=p.y,bx=W/2,byy=by,vx=bx-ax,vy=byy-ay,len2=vx*vx+vy*vy;
    for(const q of L){if(q===p)continue;let t=((q.x-ax)*vx+(q.y-ay)*vy)/len2;if(t<=0||t>=1)continue;const px=ax+vx*t,py=ay+vy*t;if(Math.hypot(q.x-px,q.y-py)<capOf(q)*.55+10)return false}return true};
  for(let att=0;att<80;att++){
    const L=[P];
    for(let tries=0;tries<300&&L.length<5+(att%2);tries++){
      const x=rnd(58,W-58),y=rnd(yMin,Math.max(yMin+10,yMax));
      if(L.every(q=>Math.hypot(q.x-x,q.y-y)>118)){
        const q=mkPlanet(genI++,x,y);q.t=L.length===3?'g':'n';q.R=q.t==='g'?rnd(32,38):rnd(20,27);q.cap=q.R+(q.t==='g'?78:rnd(54,64));q.hue=q.t==='g'?36:rnd(190,320);q.seen=true;L.push(q);
      }
    }
    if(L.length>=4&&L.every(q=>clear(q,L))){list=L;break}
    if(att===79)list=L;
  }
  P.seen=true;list.sort((a,b)=>b.y-a.y);planets=list;
  const hp=Math.round(d.hp*(1+.6*loop));
  boss={idx:bossIdx,d,hp,max:hp,R:d.R,x:W/2,y:by,st:0,state:'intro',flash:0,sq:0,q:[],turn:0,phase:0,hitT:0,last:'',ph:rnd(0,TAU)};
  bo2max=bo2=22+5*(bossIdx%BOSSES.length)+2*loop+3*up.o2;bcombo=0;s.hitF=false;haz=[];
  banner={t:0,dur:3,a:'BOSS '+((bossIdx%BOSSES.length)+1)+' / '+BOSSES.length,b:d.n,c:'hsl('+d.hue+',100%,70%)',sub:d.line};
  shake=8;flashScreen(.35,'hsl('+d.hue+',100%,70%)');thump(70,28,1.4,.4);noise(1.6,.25,900,60);vibe([40,30,80]);
}
function aliveP(){return planets.filter(p=>!p.dead)}
function mkTele(k){
  const b=boss,o={k,t:2};
  if(k==='meteor'){const n=2+(b.phase>0?1:0)+(Math.random()<.5?1:0);o.xs=[];for(let i=0;i<n;i++)o.xs.push(rnd(40,W-40))}
  else if(k==='comet'){const left=Math.random()<.5;o.x0=left?-30:W+30;o.x1=left?W+30:-30;o.y0=rnd(b.y+b.R+30,camY+VH-170);o.y1=clamp(o.y0+rnd(-130,150),b.y+b.R,camY+VH-80)}
  else if(k==='beam'){const tg=ship.mode==='orb'&&Math.random()<.5?ship.p:pickOf(aliveP());o.a=clamp(Math.atan2(tg.y-b.y,tg.x-b.x)+rnd(-.1,.1),.35,PI-.35)}
  else if(k==='jet'){o.as=[PI/2-.5,PI/2+.5]}
  else if(k==='hole'){for(let n=0;n<30;n++){o.x=rnd(60,W-60);o.y=rnd(b.y+b.R+60,camY+VH-150);if(planets.every(p=>Math.hypot(p.x-o.x,p.y-o.y)>p.R+50))break}}
  else if(k==='collapse'){o.p=pickOf(aliveP());o.t=3}
  else if(k==='wind'){o.dir=Math.random()<.5?-1:1;o.t=1}
  return o;
}
function queueAttack(){
  const b=boss;let pool=b.d.pat.filter(k=>k!==b.last&&!(k==='collapse'&&aliveP().length<4)&&!(k==='hole'&&haz.filter(h=>h.k==='hole').length>=2)&&!b.q.some(a=>a.k===k));
  if(!pool.length)pool=b.d.pat.filter(k=>!(k==='collapse'&&aliveP().length<4));
  const k=pickOf(pool);b.last=k;b.q.push(mkTele(k));
}
function bossTurn(){
  const b=boss;if(!b||b.state!=='fight')return;
  b.turn++;
  for(const a of b.q)a.t--;
  const due=b.q.filter(a=>a.t<=0);b.q=b.q.filter(a=>a.t>0);

/* ---------- 갱신 ---------- */
function update(dt){
  const s=ship,v=spd();
  if(s.inv>0)s.inv-=dt;if(s.ramT>0)s.ramT-=dt;
  const bf=boss&&boss.state==='fight';
  if(boss){updateBoss(dt)}
  if(s.mode==='orb'){
    const p=s.p;if(!boss||bf)s.r-=dec(p)*dt*(boss?.4:1);const da=v/Math.max(s.r,8)*dt;s.a+=s.dir*da;s.swept+=da;
    s.x=p.x+Math.cos(s.a)*s.r;s.y=p.y+Math.sin(s.a)*s.r;
    if(s.r<=p.R+3){die('궤도가 붕괴해 행성에 추락');if(st!=='play')return}
  }else{
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.air+=dt;
    if(Math.random()<dt*60*.7)parts.push({x:s.x,y:s.y,vx:rnd(-12,12),vy:rnd(-12,12),t:0,l:.28,c:'rgba(160,220,255,.9)',s:2});
    if(s.x<6&&s.vx<0){s.x=6;s.vx*=-1;beep(170,.05);sparks(6,s.y,'#bfeaff',7,220,0,.8);shake=Math.max(shake,2.5)}
    if(s.x>W-6&&s.vx>0){s.x=W-6;s.vx*=-1;beep(170,.05);sparks(W-6,s.y,'#bfeaff',7,220,PI,.8);shake=Math.max(shake,2.5)}
    if(boss&&s.y<camY+10&&s.vy<0){s.y=camY+10;s.vy*=-1}
    if(s.last&&Math.hypot(s.x-s.last.x,s.y-s.last.y)>capOf(s.last)+8)s.last=null;
    if(bf&&s.ramT<=0&&Math.hypot(s.x-boss.x,s.y-boss.y)<boss.R+6){ram();if(st!=='play'||!boss||boss.state!=='fight')return}
    for(const p of planets){
      if(p===s.last||p.dead)continue;
      const dx=s.x-p.x,dy=s.y-p.y,d=Math.hypot(dx,dy);
      if(d>=capOf(p))continue;
      if(d<p.R*.55){burst(s.x,s.y,'#ffb070',16,200);die('행성에 정면충돌');break}
      if(dx*s.vx+dy*s.vy>=0||d<p.R+10){latch(p,dx,dy,d);break}
    }
    if(st!=='play')return;
    if(s.mode==='free'){
      if(boss){if(boss.state==='fight'){bo2-=dt;if(bo2<=0){bo2=0;die('산소 고갈')}}}
      else if(s.air>o2max()){die('산소 고갈')}
      if(st!=='play')return;
      if(boss&&s.y>camY+VH-12&&s.vy>0){s.y=camY+VH-12;s.vy*=-1;bo2=Math.max(0,bo2-.8);beep(120,.08,'triangle',.08);sparks(s.x,s.y,'#ff8a7a',9,240,-PI/2,.9);shake=Math.max(shake,4);texts.push({x:s.x,y:s.y-16,t:0,s:'-0.8s',c:'#ff8a7a',sz:14})}

}
function updateBoss(dt){
  const b=boss;b.st+=dt;if(b.flash>0)b.flash-=dt;if(b.sq>0)b.sq=Math.max(0,b.sq-dt*5);if(b.hitT>0)b.hitT-=dt;

    if(b.st>2.6){b.state='fight';b.st=0;queueAttack();b.q[0].t=2;toast('보스의 공격을 읽고 박치기!','#ffe27a')}

  }
  if(b.state==='dying'){
    if(Math.random()<dt*14){const an=rnd(0,TAU),r=rnd(0,b.R);burst(b.x+Math.cos(an)*r,b.y+Math.sin(an)*r,pickOf(['#fff','#ffd070',BOSSES[b.idx%BOSSES.length].col[1]]),10,260);ringFx(b.x+Math.cos(an)*r,b.y+Math.sin(an)*r,'#fff',2,40,.3,2);shake=Math.max(shake,8);if(Math.random()<.25)noise(.2,.2,3000,200)}

      case 'rock':h.y+=h.vy*dt;h.rot+=dt*4;if(Math.hypot(s.x-h.x,s.y-h.y)<h.r+7)hurt(h.x,h.y-30);if(h.y>camY+VH+60)h.dead=true;
        if(Math.random()<dt*60)parts.push({x:h.x+rnd(-5,5),y:h.y-10,vx:rnd(-20,20),vy:-rnd(20,90),t:0,l:.35,c:pickOf(['#ffb06a','#ff7a3a','#ffe27a']),s:3});break;

      case 'beam':if(h.t>h.dur)h.dead=true;else if(h.t>.2){const dx=s.x-h.x,dy=s.y-h.y,c=Math.cos(h.a),sn=Math.sin(h.a),pr=dx*c+dy*sn,pp=Math.abs(dx*sn-dy*c);if(pr>0&&pp<17){const sg=(-dx*sn+dy*c)>=0?1:-1;hurt(s.x+sn*sg*30,s.y-c*sg*30)}}break;

      case 'hole':{if(s.mode==='free'){const dx=h.x-s.x,dy=h.y-s.y,d=Math.hypot(dx,dy);if(d<150){const a=16000/(d+40);s.vx+=dx/d*a*dt;s.vy+=dy/d*a*dt}if(d<h.r+6)hurt(h.x,h.y)}
        if(Math.random()<dt*50){const an=rnd(0,TAU);parts.push({x:h.x+Math.cos(an)*60,y:h.y+Math.sin(an)*60,vx:-Math.cos(an)*80,vy:-Math.sin(an)*80,t:0,l:.6,c:'#c88aff',s:2})}break}

    }
  }

  if(s.mode==='free'){const m=Math.hypot(s.vx,s.vy),mx=spd()*1.25;if(m>mx){s.vx*=mx/m;s.vy*=mx/m}}
}

function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

function drawBoss(b){

    const ca=T*1.3;g.fillStyle='#fff';g.beginPath();g.arc(Math.cos(ca)*R*1.9,Math.sin(ca)*R*1.9*.5,5,0,TAU);g.fill()}

    const y=VH*.22+84,L=[['터치','궤도를 벗어나 직진'],['스치기','행성 옆을 지나면 포획'],['서두르기','한 바퀴 전에 떠나면 콤보'],['주의','궤도는 계속 좁아진다'],['보스','항성을 들이받아 쓰러뜨려라']];
    L.forEach((l,i)=>{txt(l[0],VW/2-14,y+i*30,15,i===4?'#ff9a8a':'#ffe27a','right',700);txt(l[1],VW/2+2,y+i*30,15,'rgba(255,255,255,.85)','left',500)});
    g.globalAlpha=.6+.4*Math.sin(T*4);txt('화면을 터치해서 출발',VW/2,VH-86,19,'#fff');g.globalAlpha=1;
    if(best>0)txt('최고 기록 '+best+(bestBoss>0?'  ·  보스 '+Math.min(bestBoss,BOSSES.length)+'/'+BOSSES.length+(bestBoss>=BOSSES.length?' 클리어':''):''),VW/2,VH-52,14,'rgba(255,255,255,.6)','center',500);
  }
  if(st==='pick'){
    g.fillStyle='rgba(5,6,15,.78)';g.fillRect(0,0,VW,VH);
    txt(kills>0&&nextBoss===hops+10&&hops%7!==0?'보스 격파 — 강화 선택':'섹터 돌파 — 강화 선택',VW/2,VH/2-152,20,'#fff','center',800);
    cards.forEach((c,i)=>{
      const r=cardRect(i);g.globalAlpha=clamp(pickT*3-i*.25,0,1);
      rr(r.x,r.y,r.w,r.h,14);g.fillStyle='rgba(22,24,48,.95)';g.fill();g.strokeStyle=c.c;g.lineWidth=2;g.stroke();
      g.fillStyle=c.c;g.beginPath();g.arc(r.x+36,r.y+42,17,0,TAU);g.fill();
      txt(String(i+1),r.x+36,r.y+48,17,'#0b0c1c','center',800);
      txt(c.n,r.x+66,r.y+36,18,'#fff','left',800);
      txt(c.d,r.x+66,r.y+60,12,'rgba(255,255,255,.7)','left',500);
      txt('Lv '+up[c.k]+' → '+(up[c.k]+1),r.x+r.w-14,r.y+36,12,c.c,'right',700);
    });
    g.globalAlpha=1;
  }
  if(st==='clear'){
    const a=clamp(clearT*1.5,0,1);g.fillStyle='rgba(5,6,15,'+(.7*a)+')';g.fillRect(0,0,VW,VH);g.globalAlpha=a;
    txt('TON 618 격파',VW/2,VH*.28,44,'#ffe27a','center',900);txt('우주의 끝에서 살아 돌아왔다',VW/2,VH*.28+32,15,'rgba(255,255,255,.8)','center',500);
    txt(String(score),VW/2,VH*.28+112,64,'#fff','center',900);txt(newBest?'★ 신기록 ★':'최고 '+best,VW/2,VH*.28+142,16,newBest?'#ffe27a':'rgba(255,255,255,.6)','center',700);
    txt('행성 '+hops+'개  ·  보스 '+kills+'회 격파',VW/2,VH*.28+172,14,'rgba(255,255,255,.75)','center',500);
    if(clearT>1){g.globalAlpha=.6+.4*Math.sin(T*4);txt('터치해서 계속 항해 (더 강한 보스가 기다린다)',VW/2,VH-80,16,'#fff')}
    g.globalAlpha=1;
  }
  if(st==='dead'){
    const a=clamp(deadT*2,0,1);g.fillStyle='rgba(5,6,15,'+(.72*a)+')';g.fillRect(0,0,VW,VH);g.globalAlpha=a;
    txt('항해 종료',VW/2,VH*.3,40,'#fff','center',900);
    txt(deadWhy,VW/2,VH*.3+30,15,'#ff8f8f','center',500);
    if(boss&&boss.state==='fight')txt(boss.d.n+' 남은 체력 '+Math.max(1,Math.round(boss.hp/boss.max*100))+'%',VW/2,VH*.3+52,13,'rgba(255,200,170,.85)','center',600);
    txt(String(score),VW/2,VH*.3+110,64,'#fff','center',900);
    txt(newBest?'★ 신기록 ★':'최고 '+best,VW/2,VH*.3+140,16,newBest?'#ffe27a':'rgba(255,255,255,.6)','center',700);
    txt('행성 '+hops+'개  ·  최대 콤보 x'+maxCombo+'  ·  보스 '+kills+'회 격파',VW/2,VH*.3+172,14,'rgba(255,255,255,.75)','center',500);
    if(deadT>.7){g.globalAlpha=.6+.4*Math.sin(T*4);txt('터치해서 다시 출발',VW/2,VH-80,19,'#fff')}
    g.globalAlpha=1;
  }
}
function drawBossHud(){
  const b=boss,bw=300,bx=VW/2-bw/2,by=92;
  txt(b.d.n,VW/2,by-8,14,'#fff','center',800);
  g.fillStyle='rgba(255,255,255,.14)';rr(bx,by,bw,11,5);g.fill();
  const f=clamp(b.hp/b.max,0,1);g.fillStyle=b.hitT>0?'#fff':'hsl('+b.d.hue+',90%,58%)';rr(bx,by,Math.max(8,bw*f),11,5);g.fill();
  g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=2;const ph=b.d.kind==='quasar'?[.66,.33]:[.5];for(const q of ph){g.beginPath();g.moveTo(bx+bw*q,by);g.lineTo(bx+bw*q,by+11);g.stroke()}
  txt(Math.max(0,Math.ceil(b.hp))+' / '+b.max,VW/2,by+25,11,'rgba(255,255,255,.65)','center',600);
  if(b.state==='fight'){
    let x=VW/2-(b.q.length*74)/2+37;for(const a of b.q){const [nm,c]=ATK[a.k];rr(x-34,by+34,68,22,8);g.fillStyle='rgba(10,8,24,.75)';g.fill();g.strokeStyle=a.t<=1?'#ff6a6a':c;g.lineWidth=1.5;g.stroke();txt(nm+' '+a.t,x,by+49,12,a.t<=1?'#ff9a9a':c,'center',700);x+=74}
    if(bcombo>0)txt('연속 박치기 x'+bcombo,VW/2,by+74,13,'#ff9d7a','center',700);
    // 산소 게이지 (보스전: 회복되지 않는다)
    const ow=280,ox=VW/2-ow/2,oy=VH-44,of=clamp(bo2/bo2max,0,1),low=bo2<6;
    g.fillStyle='rgba(255,255,255,.14)';rr(ox,oy,ow,12,6);g.fill();g.fillStyle=low?'rgba(255,'+Math.floor(80+80*Math.sin(T*10))+',80,1)':'#b8a8ff';rr(ox,oy,Math.max(6,ow*of),12,6);g.fill();
    g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=1.5;rr(ox,oy,ow,12,6);g.stroke();
    txt('산소 '+bo2.toFixed(1)+'초  ·  날아다닐 때만 줄고, 회복되지 않아',VW/2,oy-8,12,low?'#ff9a9a':'rgba(220,210,255,.85)','center',700);
  }
}

/* ---------- 입력 ---------- */
function tap(px,py,key){
  ac();
  if(st==='title'){st='play';beep(520,.1);return}
  if(st==='play'){release();return}
  if(st==='pick'){
    if(pickT<.45||key)return;
    const vx=px/S,vy=py/S;
    for(let i=0;i<cards.length;i++){const r=cardRect(i);if(vx>=r.x&&vx<=r.x+r.w&&vy>=r.y&&vy<=r.y+r.h){choose(i);return}}
    return;
  }
  if(st==='clear'&&clearT>1){offer();if(st==='clear')st='play';return}
  if(st==='dead'&&deadT>.7){reset();st='play'}
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap(e.clientX,e.clientY,false)});
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();tap(0,0,true)}
  else if(st==='pick'&&pickT>.45&&(e.key==='1'||e.key==='2'||e.key==='3')){const i=+e.key-1;if(cards[i])choose(i)}
});

/* ---------- 루프 ---------- */
function step(dt){ // 한 프레임의 논리 갱신. 화면 그리기에 쓸 dt(gdt)를 정한다
  T+=dt;
  if(flashA>0)flashA=Math.max(0,flashA-dt*2.4);
  zoom+=(0-zoom)*Math.min(1,dt*10);
  if(banner){banner.t+=dt;if(banner.t>banner.dur)banner=null}
  if(tsT>0){tsT-=dt;if(tsT<=0)ts=1}
  if(freeze>0){freeze-=dt;gdt=dt*.1;return}
  const sd=dt*ts;gdt=sd;
  if(st==='title'){const s=ship;s.a+=sd*spd()/s.r;s.x=s.p.x+Math.cos(s.a)*s.r;s.y=s.p.y+Math.sin(s.a)*s.r;s.trail.push(s.x,s.y);if(s.trail.length>48)s.trail.splice(0,2)}
  else if(st==='play'){update(sd/2);if(st==='play')update(sd/2)}
  else if(st==='pick')pickT+=dt;
  else if(st==='dead'){deadT+=dt;if(boss)updateBossIdle(sd)}
  else if(st==='clear')clearT+=dt;
}
function updateBossIdle(dt){boss.st+=dt}
let lastT=0;
function frame(now){
  const dt=Math.min(.033,(now-lastT)/1000||0);lastT=now;
  step(dt);draw(gdt||dt);
  requestAnimationFrame(frame);
}
reset();
/* 디버그/자동 테스트용 */
function botAct(){
  if(st==='title'){tap(0,0,true);return}
  if(st==='pick'){if(pickT>.5)choose(0);return}
  if(st==='clear'&&clearT>1){tap(0,0,true);return}
  if(st==='dead'&&deadT>.8){tap(0,0,true);return}
  if(st!=='play'||ship.mode!=='orb')return;
  if(boss&&boss.state!=='fight')return;
  const s=ship,p=s.p,hx=-Math.sin(s.a)*s.dir,hy=Math.cos(s.a)*s.dir;let tx,ty,tr;
  if(boss){tx=boss.x;ty=boss.y;tr=boss.R+2}
  else{let bp=null;for(const q of planets){if(q.seen||q.dead||q.y>s.y)continue;if(!bp||q.y>bp.y)bp=q}if(!bp)return;tx=bp.x;ty=bp.y;tr=capOf(bp)*.5}
  const dx=tx-s.x,dy=ty-s.y,tp=dx*hx+dy*hy,perp=Math.abs(dx*hy-dy*hx);
  if((tp>0&&perp<tr)||s.r<p.R+13)release();
}
window.__dbg={
  get:()=>({st,score,hops,combo,mode:ship.mode,up,boss:boss?{n:boss.d.n,hp:boss.hp,max:boss.max,state:boss.state,turn:boss.turn,q:boss.q.map(a=>a.k+a.t),phase:boss.phase}:null,bo2,bossIdx,kills,haz:haz.length}),
  jump(i){if(st==='title')st='play';bossIdx=i;hops=Math.max(hops,1);nextBoss=0;},
  sim(sec,opts){opts=opts||{};const n=Math.round(sec*60);for(let i=0;i<n;i++){if(!opts.nobot)botAct();step(1/60);if(opts.draw&&i%opts.draw===0)draw(gdt||1/60)}return this.get()},
  draw(){draw(1/60)},
  set(o){if(o.hp!=null&&boss)boss.hp=o.hp;if(o.o2!=null)bo2=o.o2;if(o.shield!=null)up.shield=o.shield;if(o.hops!=null)hops=o.hops},
  ev(){return {freeze,ts,shake,zoom,flashA}}
};
requestAnimationFrame(frame);
