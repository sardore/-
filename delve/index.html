<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<title>구덩이 DELVE</title>
<style>
*{box-sizing:border-box}
:root{--bg:#07070c;--pn:#14141f;--pn2:#1e1e2e;--ln:#2e2e46;--tx:#e6e8f5;--dim:#8a8fb0;--gold:#ffd23f;--acc:#8fc7ff}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.dim{color:var(--dim)}small{color:var(--dim);font-weight:500}
#game{display:none;position:fixed;inset:0;flex-direction:column;max-width:900px;margin:0 auto}#game.on{display:flex}
#hud{padding:max(6px,env(safe-area-inset-top)) 10px 6px;background:var(--pn);border-bottom:1px solid var(--ln)}
.l1{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden}.l1 b{color:var(--tx);font-size:14px}.l1 .dp{margin-left:auto;color:var(--acc);font-weight:700}.l1 .gd{color:var(--gold);font-weight:700}
.bars{display:flex;gap:6px;margin-top:5px}.bar{position:relative;flex:1;height:17px;border-radius:5px;background:#0a0a12;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:#c0392b}.bar.mp i{background:#2b6cc0}.bar.xp i{background:#3a3a5c}.bar.hp.low i{background:#ff3b3b;animation:bl .5s infinite alternate}@keyframes bl{to{opacity:.5}}
.bar em{position:relative;display:block;text-align:center;font-style:normal;font-size:11px;font-weight:700;line-height:17px;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.tm{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;min-height:0}.tm i{font-style:normal;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px}.tm .good{background:#17324a;color:#8fd0ff}.tm .bad{background:#4a1717;color:#ff9a9a}.tm .warn{background:#4a3a17;color:#ffd28a}
#mapw{position:relative;flex:1;min-height:0}#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#log{position:absolute;left:8px;top:6px;right:160px;pointer-events:none;font-size:12.5px;line-height:1.35;text-shadow:0 0 4px #000,0 1px 2px #000,0 0 8px #000}
#mini{position:absolute;right:6px;top:6px;width:144px;height:80px;border:1px solid var(--ln);border-radius:6px;opacity:.85;image-rendering:pixelated;background:#000}#mini.big{width:288px;height:160px}
#look{display:none;position:absolute;left:8px;right:8px;bottom:8px;background:rgba(16,16,28,.94);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;font-size:12.5px;pointer-events:none}#look.on{display:block}#look p{margin:2px 0;color:#c8cce6}#look p.h{color:var(--gold);font-weight:700;font-size:13.5px}
#quick{display:flex;gap:6px;padding:6px 8px 0;background:var(--pn);min-height:0;flex-wrap:wrap}#quick:empty{display:none}
.q{background:var(--pn2);border:1px solid var(--ln);border-radius:9px;padding:6px 10px;font-size:12px;font-weight:700}.q.heal{border-color:#7a2f2f;color:#ffb3b3}
#bar{display:flex;gap:5px;padding:6px 8px max(8px,env(safe-area-inset-bottom));background:var(--pn)}
#bar button{flex:1;min-width:0;background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:7px 0 6px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar button b{display:block;font-size:17px;line-height:1.05;font-family:ui-monospace,Menlo,monospace;color:var(--acc)}#bar button.hot{border-color:var(--acc);background:#14283a}#bar button:active,.q:active{filter:brightness(1.5)}
#sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:5;align-items:flex-end;justify-content:center}#sheet.on{display:flex}
.sh{width:min(100%,560px);max-height:86dvh;background:var(--pn);border-radius:16px 16px 0 0;border:1px solid var(--ln);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:0}}
.shh{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;font-size:16px}.shh .gd{color:var(--gold);font-weight:800;font-size:14px;margin-left:auto}.shh .x{margin-left:auto;width:34px;height:34px;border-radius:10px;background:var(--pn2)}.shh .gd+.x{margin-left:6px}
.tabs{display:flex;gap:6px;padding:0 12px 8px}.tabs button{flex:1;padding:8px;border-radius:9px;background:var(--pn2);font-weight:700;color:var(--dim)}.tabs .on{background:#2a3a5a;color:#fff}
.list{overflow-y:auto;padding:0 10px 12px;-webkit-overflow-scrolling:touch}
.it{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 8px;border-bottom:1px solid #ffffff0d;cursor:pointer}.it.open{background:#1a1a2c;border-radius:10px}
.gl{width:22px;text-align:center;font:800 17px ui-monospace,Menlo,monospace}.nm{flex:1;min-width:0;font-size:13.5px}.nm small{display:block;font-size:11px;margin-top:1px}
.ds{flex-basis:100%;padding:2px 0 0 30px;font-size:12px;color:#b8bcd8}.ds p{margin:2px 0}.acts{display:flex;gap:6px;margin-top:8px}.acts button{flex:1;padding:9px;border-radius:9px;background:var(--pn2);font-weight:700}.acts .pri,.pr{background:var(--gold);color:#1a1500}
.pr{padding:6px 10px;border-radius:8px;font-weight:800;font-size:12.5px;white-space:nowrap}.pr small{color:#5a4a00;margin-left:4px}.pr.no{background:#3a3a4a;color:#888}
.it.dis{opacity:.4;cursor:default}.menu button{display:block;width:100%;text-align:left;padding:13px 10px;border-bottom:1px solid #ffffff0d;font-size:14.5px}
.logs p,.help p{margin:5px 2px;font-size:13px;line-height:1.5}.help b{color:var(--gold);margin-right:6px}.char p{margin:8px 2px;line-height:1.6}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.grid4 span{background:var(--pn2);border-radius:9px;padding:7px 2px;text-align:center;font-size:11px;color:var(--dim)}.grid4 b{display:block;font-size:17px;color:var(--tx)}
#title{display:none;position:fixed;inset:0;overflow-y:auto;background:radial-gradient(ellipse at 50% 20%,#1a1a30,#07070c 70%)}#title.on{display:block}
.tw{max-width:420px;margin:0 auto;padding:max(40px,env(safe-area-inset-top)) 18px 30px;text-align:center}
.tw h1{font-size:64px;margin:20px 0 0;letter-spacing:6px;font-weight:900;color:#f3ead0;text-shadow:0 0 30px #ffb34755}.sub{letter-spacing:10px;color:var(--gold);margin:0;font-size:13px}.tag{color:var(--dim);margin:14px 0 26px}
.big{display:block;width:100%;padding:14px;border-radius:13px;background:var(--pn2);border:1px solid var(--ln);font-size:17px;font-weight:800;margin-top:10px}.big small{display:block;font-size:12px;margin-top:3px}.big.pri{background:var(--gold);color:#1a1500;border-color:var(--gold)}.big.pri small{color:#5a4a00}
.hall{margin-top:26px;text-align:left;background:var(--pn);border-radius:12px;padding:12px;font-size:12.5px}.hall p{margin:6px 0}.hall small{display:block}
.cr h4{text-align:left;margin:16px 0 6px;color:var(--dim);font-size:12px}.cr input{width:100%;padding:12px;border-radius:11px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);font:inherit;font-size:16px;text-align:center;user-select:text;-webkit-user-select:text}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.opts button{padding:11px 2px;border-radius:10px;background:var(--pn2);border:1px solid var(--ln);font-weight:700}.opts .on{background:#2a3a5a;border-color:var(--acc)}.cr p{text-align:left;margin:8px 2px;font-size:12.5px}
.death{padding:26px 18px 18px;text-align:center}.tomb{display:inline-block;padding:18px 26px 12px;border-radius:60px 60px 6px 6px;background:#33334a;color:#aab;font-weight:900;letter-spacing:3px}.death h2{margin:14px 0 2px;font-size:24px}.death p{margin:4px 0}.cause{color:#ff9a9a}
@media(min-width:700px){#log{font-size:14px}.sh{border-radius:16px;margin-bottom:5vh}#sheet{align-items:center}}
</style>
</head>
<body>
<div id="title"></div>
<div id="game"><div id="hud"></div><div id="mapw"><canvas id="cv"></canvas><div id="log"></div><canvas id="mini"></canvas><div id="look"></div></div><div id="quick"></div><div id="bar"></div></div>
<div id="sheet"></div>
<script type="module" src="js/ui.js"></script>
</body>
</html>
