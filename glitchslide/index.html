<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05050d">
<title>글리치 슬라이드 GLITCH SLIDE</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05050d;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#fff}
#cv{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block}
#hud{position:fixed;left:50%;top:0;transform:translateX(-50%);width:min(100vw,460px);padding:max(8px,env(safe-area-inset-top)) 12px 0;pointer-events:none;
  text-shadow:0 0 6px #000,0 0 2px #000}
#hud .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
#hud .row>:last-child{text-align:right}
#hud .sc{font-size:30px;font-weight:900;letter-spacing:.5px;font-variant-numeric:tabular-nums}
#hud .hp{color:#ff5a7a;font-size:19px;letter-spacing:1px}#hud .hp i{color:#3a2a3a;font-style:normal}
#hud .bt{color:#ffd23f;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
#hud .s{font-size:12px;color:#a9b0d6;font-weight:600;margin-top:1px}#hud .ch{color:#ff8fd0;font-weight:800;font-size:13px}
#hud .warn{color:#ff4d8d;font-weight:800}
.sks{display:flex;gap:6px;margin-top:6px}
.sk{position:relative;min-width:30px;height:30px;padding:0 6px;border-radius:8px;border:2px solid var(--c);color:var(--c);background:#0b0b1acc;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;text-shadow:none}
.sk i{font-style:normal;font-size:10px;margin-left:2px;opacity:.85}.sk.cd{opacity:.45;border-style:dashed}
.sk u{position:absolute;right:-5px;top:-7px;text-decoration:none;font-size:10px;background:#fff;color:#000;border-radius:8px;padding:0 4px}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,5,13,.8);padding:16px}
#ov.on{display:flex}
.panel{width:min(100%,380px);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.logo{font-size:58px;line-height:.92;font-weight:900;letter-spacing:2px;color:#ffe14a;text-shadow:3px 0 #ff2bd6,-3px 0 #22e6ff}
.sub{letter-spacing:6px;font-size:13px;color:#22e6ff;font-weight:700;margin-bottom:8px}
.how{list-style:none;margin:0 0 6px;padding:0;text-align:left;font-size:14px;color:#cfd4f0;display:grid;gap:7px}
.how b{display:inline-block;width:52px;color:#ffe14a}
.ttl{font-size:30px;font-weight:900}.big{font-size:64px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.dim{font-size:13px;color:#a9b0d6}
.btn{appearance:none;border:0;border-radius:14px;background:#ffe14a;color:#0b0b1a;font-family:inherit;font-weight:900;font-size:20px;padding:14px 0;width:100%;margin-top:8px;cursor:pointer}
.btn.ghost{background:transparent;color:#cfd4f0;border:2px solid #3b4170}
.card{appearance:none;width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:#12132b;border:2px solid var(--c);border-radius:14px;
  padding:12px;color:#fff;font-family:inherit;cursor:pointer}
.card .ic{flex:none;width:40px;height:40px;border-radius:50%;background:var(--c);color:#0b0b1a;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900}
.card .tx{flex:1;display:flex;flex-direction:column;gap:3px;font-size:13px;color:#cfd4f0}.card b{font-size:17px;color:#fff}.card i{font-style:normal;font-size:11px;color:var(--c);margin-left:4px}
.card .pr{flex:none;font-weight:900;color:#ffd23f;font-size:16px}.card.poor{opacity:.5}.card.off{opacity:.3;pointer-events:none}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;margin:6px 0;font-size:11px;color:#a9b0d6}
.stat span{display:flex;flex-direction:column;gap:2px;background:#12132b;border-radius:10px;padding:8px 2px}.stat b{font-size:18px;color:#fff}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"></div>
<div id="ov"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
